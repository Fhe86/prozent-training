:root {
  --blau: #2563c9; --blau-tief: #173f86; --blau-hell: #e4edfc; --blau-mittel: #bcd3f7;
  --gelb: #ffd24d; --gelb-hell: #fff5cf; --koralle: #ff6f5e; --koralle-hell: #ffe4df;
  --gruen: #1f9d62; --gruen-hell: #dcf5e8; --rot: #cf3a2c; --rot-hell: #fde6e3;
  --papier: #f4f7fc; --karte: #ffffff; --tinte: #14233d; --grau: #5a6a84; --linie: #d6e0ef;
  --r: 22px; --schatten: 0 2px 0 #d6e0ef, 0 10px 24px rgba(23, 63, 134, .07);
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--papier); color: var(--tinte); font: 17px/1.5 "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, .schrift { font-family: "Delius", "Comic Neue", "Avenir Next", sans-serif; font-weight: 400; line-height: 1.2; }
.huelle { width: min(1120px, 100%); margin: 0 auto; padding: 0 16px 56px; }

/* Kopf */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 18px; flex-wrap: wrap; }
.marke { display: flex; align-items: center; gap: 10px; font: 22px "Delius", sans-serif; color: var(--blau-tief); background: none; border: 0; padding: 4px 0; min-height: 44px; }
.marke svg { width: 38px; height: 38px; }
.reiter { display: flex; gap: 6px; background: #fff; padding: 5px; border-radius: 999px; box-shadow: var(--schatten); }
.reiter button { min-height: 44px; padding: 0 18px; border: 0; background: none; border-radius: 999px; font-weight: 600; color: var(--grau); }
.reiter button[aria-current="page"] { background: var(--blau); color: #fff; }

/* Bento */
.bento-kopf { display: grid; grid-template-columns: 300px 1fr; gap: 16px; margin-bottom: 16px; }
.kachel { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; }
.coach-kachel { display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; }
.coach-kreis { width: 190px; height: 190px; border-radius: 50%; background: var(--koralle); display: grid; place-items: center; margin-bottom: 12px; overflow: visible; }
.coach-kreis svg { width: 150px; height: 150px; overflow: visible; }
.coach-kachel h2 { font-size: 25px; }
.coach-kachel p { color: var(--grau); font-size: 15px; }
.held h1 { font-size: clamp(30px, 4.6vw, 46px); color: var(--blau-tief); margin: 6px 0 12px; }
.held .ueber { color: var(--grau); font-size: 15px; }
.held p { max-width: 58ch; }
.knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.knopf { min-height: 50px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--blau); color: #fff; font-weight: 700; box-shadow: 0 3px 0 var(--blau-tief); }
.knopf:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blau-tief); }
.knopf.zwei { background: #fff; color: var(--blau-tief); box-shadow: inset 0 0 0 2px var(--blau-mittel), 0 3px 0 var(--blau-mittel); }
.knopf.gelb { background: var(--gelb); color: var(--tinte); box-shadow: 0 3px 0 #d9a91d; }
.knopf[disabled] { opacity: .45; cursor: default; }
.klein { font-size: 15px; color: var(--grau); }
.tagkopf { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; flex-wrap: wrap; }
.tagkopf h2 { font-size: 26px; color: var(--blau-tief); }
.raster { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.station { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; border: 0; background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 18px; min-height: 190px; grid-column: span 2; transition: transform .15s; overflow: hidden; }
.station:hover { transform: translateY(-2px); }
.station.gross { grid-column: span 3; }
.station .bild { width: 76px; height: 76px; margin-bottom: 4px; }
.station b { font: 22px "Delius", sans-serif; }
.station small { color: var(--grau); font-size: 15px; line-height: 1.35; }
.station.farbe0 { background: var(--blau-hell); } .station.farbe1 { background: var(--gelb-hell); } .station.farbe2 { background: var(--koralle-hell); } .station.farbe3 { background: #e7f3f5; }
.abzeichen { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; }
.ampel { position: absolute; left: 18px; bottom: 12px; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.station.hat-ampel { padding-bottom: 40px; }
.ampel.rot { background: var(--koralle); color: #fff; } .ampel.gelb { background: var(--gelb); } .ampel.gruen { background: var(--gruen); color: #fff; }

/* Station */
.station-kopf { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

.punkt { width: 18px; height: 18px; border-radius: 50%; background: var(--linie); }
.punkt.an { background: var(--gelb); box-shadow: inset 0 0 0 2px #d9a91d; }
.arbeit { display: grid; grid-template-columns: 5fr 6fr; gap: 16px; align-items: start; }
.arbeit.breit { grid-template-columns: 1fr; }
.szene { min-height: 200px; }
.szene h2 { font-size: 22px; margin-bottom: 8px; color: var(--blau-tief); }
.bildflaeche { margin-top: 12px; display: flex; justify-content: center; }
.bildflaeche svg { width: 100%; max-width: 340px; height: auto; }
.heft-hinweis { display: flex; gap: 10px; align-items: center; background: var(--gelb-hell); border-radius: 12px; padding: 8px 12px; font-size: 15px; margin-bottom: 12px; }
.teil { padding: 10px 0; border-bottom: 1px dashed var(--linie); }
.teil:last-of-type { border-bottom: 0; }
.teil label, .teil .frage { display: block; font-weight: 600; margin-bottom: 6px; }
.hilfe { font-size: 15px; color: var(--grau); margin-bottom: 6px; }
.eingabe { display: flex; align-items: center; gap: 8px; }
.eingabe input { width: 150px; min-height: 48px; padding: 0 12px; border: 2px solid var(--blau-mittel); border-radius: 12px; background: #fff; font-size: 20px; font-weight: 600; }
.eingabe input:focus { outline: 3px solid var(--gelb); border-color: var(--blau); }
.richtig input, input.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
.falsch input, input.falsch { border-color: var(--rot); background: var(--rot-hell); }
.meldung { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--rot); }
.meldung.gut { color: #1d7a4a; }
.ok-haken { color: var(--gruen); font-weight: 700; }
.bruch-eingabe { display: inline-flex; flex-direction: column; gap: 4px; align-items: center; }

.option[aria-pressed="true"] { background: var(--blau); border-color: var(--blau); color: #fff; }
.option.richtig { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.option.falsch { background: var(--rot); border-color: var(--rot); color: #fff; }
.aktionen { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.textlink { min-height: 44px; border: 0; background: none; color: var(--blau); font-weight: 700; text-decoration: underline; padding: 0 4px; }
.coachzeile { display: flex; gap: 10px; align-items: center; margin-top: 14px; border-radius: 14px; padding: 8px 14px; font-weight: 600; }

.bon { background: #fff; width: 100%; max-width: 360px; margin: 0 auto; padding: 16px 16px 26px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; box-shadow: var(--schatten); clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 97%, 90% 100%, 85% 97%, 80% 100%, 75% 97%, 70% 100%, 65% 97%, 60% 100%, 55% 97%, 50% 100%, 45% 97%, 40% 100%, 35% 97%, 30% 100%, 25% 97%, 20% 100%, 15% 97%, 10% 100%, 5% 97%, 0 100%); }

.bon .zz { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px dashed #bbc; }

.mkarte { aspect-ratio: 1.15; min-height: 62px; border: 2px solid var(--blau-mittel); background: #fff; border-radius: 14px; font: 21px "Delius", sans-serif; display: grid; place-items: center; }

.kreisfeld { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

.liste li { margin: 6px 0 6px 20px; }
.plan { border-collapse: collapse; width: 100%; font-size: 16px; }
.plan th, .plan td { border-bottom: 1px solid var(--linie); padding: 8px; text-align: left; vertical-align: top; }
.qr { width: 190px; height: 190px; display: block; }
.fortschritt { height: 12px; background: var(--linie); border-radius: 999px; overflow: hidden; margin: 8px 0 12px; }
.fortschritt i { display: block; height: 100%; background: var(--blau); transition: width .3s; }
.uhr { font: 28px "Delius", sans-serif; color: var(--koralle); }

/* Checkliste */
.ckheld { margin-bottom: 16px; }
.ckstand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.ckstand .fortschritt { flex: 1 1 220px; margin: 0; height: 14px; }
.ckstand .fortschritt i { background: var(--gruen); }
.ckraster { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.ckgruppe { border-top: 8px solid var(--blau-mittel); }
.ckgruppe.farbe1 { border-top-color: var(--gelb); } .ckgruppe.farbe2 { border-top-color: var(--koralle); } .ckgruppe.farbe3 { border-top-color: #9fd3dc; }
.ckkopf { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.ckkopf svg.bild { width: 46px; height: 46px; flex: none; }
.ckkopf h2 { font-size: 23px; color: var(--blau-tief); flex: 1; }
.ckzahl { font-weight: 700; font-size: 15px; padding: 3px 12px; border-radius: 999px; background: var(--blau-hell); color: var(--blau-tief); white-space: nowrap; }
.ckzahl.voll { background: var(--gruen); color: #fff; }
.ckliste { list-style: none; padding: 0; }
.ckpunkt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linie); }
.ckpunkt:first-child { border-top: 0; }
.ckbox { position: relative; width: 44px; height: 44px; flex: none; cursor: pointer; }
.ckbox input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ckhaken { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--blau-mittel); background: #fff; color: transparent; transition: background .15s, border-color .15s; }
.ckhaken svg { width: 28px; height: 28px; }
.ckbox input:focus-visible + .ckhaken { outline: 3px solid var(--blau); outline-offset: 2px; }
.ckpunkt.an .ckhaken { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.ckpunkt.an .cktext > span { color: var(--grau); }
.cktext { font-size: 16px; line-height: 1.4; }
.ckzeile { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.ckstatus { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.ckstatus.ok { background: var(--gruen-hell); color: var(--gruen); }
.ckstatus.nochmal { background: var(--rot-hell); color: var(--rot); }
.ckzeile .textlink { font-size: 14px; }
.knopf.cktest { min-height: 44px; padding: 0 16px; font-size: 15px; white-space: nowrap; }
.ckpunkt.ok .knopf.cktest { background: #fff; color: var(--blau-tief); box-shadow: inset 0 0 0 2px var(--blau-mittel), 0 3px 0 var(--blau-mittel); }
.ckfrage { display: flex; gap: 14px; align-items: center; background: var(--gelb-hell); border-radius: 16px; padding: 12px 16px; margin: 6px 0 14px; }
.ckfrage svg.bild { width: 50px; height: 50px; flex: none; }
.ckfrage b { display: block; font-size: 18px; font-weight: 600; }

/* Hilfedialog */
.schleier { position: fixed; inset: 0; background: rgba(20, 35, 61, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.dialog { background: #fff; border-radius: var(--r); padding: 22px; max-width: 620px; width: 100%; max-height: 90vh; overflow: auto; }
.dialog h2 { color: var(--blau-tief); font-size: 25px; margin-bottom: 8px; }
.dialog h3 { margin-top: 12px; font-size: 18px; color: var(--blau-tief); }

/* Figur */
.coach { transform-origin: 50% 90%; }
.coach.hupf { animation: hupf .7s ease; }
.coach.wackel { animation: wackel .45s ease; }
.coach .arm-l { transform-origin: 34px 62px; animation: winken 2.4s ease-in-out infinite; }
.coach .auge { transform-origin: center; animation: blinzeln 4.5s infinite; transform-box: fill-box; }
@keyframes hupf { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-22px) rotate(-5deg); } 60% { transform: translateY(0) scaleY(.92); } 80% { transform: translateY(-7px); } }
@keyframes wackel { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes winken { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-16deg); } }
@keyframes blinzeln { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.feier { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .85); z-index: 30; text-align: center; padding: 20px; }
.feier svg.gross { width: 170px; height: 170px; animation: hupf .8s ease; }
.feier h2 { font-size: 34px; color: var(--blau-tief); }
.nadel { transition: transform .9s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 120px 118px; }
.zahnrad { transform-origin: center; transform-box: fill-box; animation: drehen 9s linear infinite; }
@keyframes drehen { to { transform: rotate(360deg); } }
.blase { animation: steigen 3.2s linear infinite; }
@keyframes steigen { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 820px) {
  .bento-kopf, .arbeit, .spalten2, .ckraster { grid-template-columns: 1fr; }
  .coach-kachel { flex-direction: row; text-align: left; gap: 14px; justify-content: flex-start; }
  .coach-kreis { width: 96px; height: 96px; flex: none; margin: 0; }
  .coach-kreis svg { width: 76px; height: 76px; }
  .raster { grid-template-columns: repeat(2, 1fr); }
  .station, .station.gross { grid-column: span 1; }
  .szene { min-height: 0; }
}
@media (max-width: 480px) {
  .raster { grid-template-columns: 1fr; }
  .reiter { width: 100%; justify-content: space-between; }
  .reiter button { padding: 0 6px; flex: 1; font-size: 14px; }
  .ckpunkt { grid-template-columns: auto 1fr; }
  .ckpunkt .cktest { grid-column: 2; justify-self: start; }
  .bon-zeile { grid-template-columns: 1fr; }
  .memory { grid-template-columns: repeat(2, 1fr); }
}
@media print {
  body { background: #fff; font-size: 12pt; }
  .kopf, .knoepfe, .nur-bildschirm, .schleier, .cktest, .ckzeile .textlink { display: none !important; }
  .kachel, .passkarte { box-shadow: none; border: 1px solid #99a; break-inside: avoid; }
  .huelle { width: 100%; padding: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 14mm; }
}

<script>
/* Aufgabengeneratoren fürs Prozent-Trainingslager.
   Jede Aufgabe entsteht aus einem Zahlenvorrat, der nur glatte Ergebnisse liefert.
   Läuft im Browser (window.G) und in Node (für die Tests). */
(function (root) {
  "use strict";

  /* ---------- Hilfen ---------- */
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const mischen = (r, a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const ggt = (a, b) => (b ? ggt(b, a % b) : a);
  const rund = (x, d = 6) => Math.round(x * 10 ** d) / 10 ** d;
  const ganz = x => Math.abs(x - Math.round(x)) < 1e-9;
  const nachkomma = (x, d) => ganz(x * 10 ** d);

  function zahl(x, dez) {
    const r = rund(x, 6);
    let s = dez === undefined ? String(r) : r.toFixed(dez);
    let [v, n] = s.split(".");
    const neg = v[0] === "-"; if (neg) v = v.slice(1);
    v = v.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + v + (n ? "," + n : "");
  }
  const euro = x => zahl(x, 2) + " €";
  const pz = x => zahl(x) + " %";
  const pm = x => zahl(x) + " ‰";
  const einh = (x, e) => zahl(x) + " " + e;

  const wahl = (id, label, optionen, richtig, fehler) => ({ art: "wahl", id, label, optionen, richtig, fehler: fehler || {} });
  const feld = (id, label, loesung, einheit, opt) => Object.assign({ art: "zahl", id, label, loesung, einheit: einheit || "", tol: 0.005, fehler: [] }, opt || {});

  /* ---------- 1 Lager: Brutto, Netto, Tara ---------- */
  const LAGER = [
    { name: "Honig", ding: "Ein Glas Honig", inhalt: "Honig", huelle: "das Glas", e: "g", brutto: [500, 600, 800, 1000, 1250], t: [20, 25, 30] },
    { name: "Kaffee", ding: "Eine Kiste Kaffeebohnen", inhalt: "Kaffee", huelle: "die Kiste", e: "kg", brutto: [30, 50, 60, 70, 75], t: [4, 5, 8, 10] },
    { name: "Paket", ding: "Ein Paket mit Büchern", inhalt: "Bücher", huelle: "der Karton", e: "kg", brutto: [12, 15, 16, 20, 32], t: [5, 8, 10, 12] },
    { name: "Müsli", ding: "Eine Packung Müsli", inhalt: "Müsli", huelle: "die Packung", e: "g", brutto: [600, 800, 1000, 1500, 2000], t: [4, 5, 8, 10] },
    { name: "Saft", ding: "Eine Kiste Apfelsaft", inhalt: "Saft", huelle: "die Kiste mit den Flaschen", e: "kg", brutto: [18, 24, 28, 36, 48], t: [15, 20, 25] },
    { name: "Öl", ding: "Ein Kanister Olivenöl", inhalt: "Öl", huelle: "der Kanister", e: "kg", brutto: [8, 12, 16, 20, 24], t: [4, 5, 8, 10] }
  ];

  function lagerZiehen(r) {
    for (;;) {
      const c = pick(r, LAGER), b = pick(r, c.brutto), t = pick(r, c.t);
      const tara = rund(b * t / 100), netto = rund(b - tara);
      if (nachkomma(tara, c.e === "g" ? 0 : 2)) return { c, b, t, tara, netto };
    }
  }

  function lager(r, stufe) {
    const { c, b, t, tara, netto } = lagerZiehen(r);
    const e = c.e, W = x => einh(x, e);
    const szene = (zeigt, text) => ({ typ: "waage", wert: zeigt, text });
    const fNetto = { wert: b, msg: "Das ist das Gesamtgewicht. Netto ist nur der Inhalt." };

    if (stufe === 1) {
      return {
        titel: c.ding, szene: szene(W(b), "Brutto"), nacheinander: true,
        text: `Auf der Waage steht: ${klein2(c.ding)}, zusammen <b>${W(b)}</b>. Davon macht ${c.huelle} <b>${t}&nbsp;%</b> aus.`,
        teile: [
          feld("a", "Tara in " + e, tara, e, { hilfe: `Brutto ist der Grundwert, also 100 %. Rechne ${t} % von ${W(b)}.`, fehler: [{ wert: t, msg: "Das ist der Prozentsatz. Gesucht ist das Gewicht." }] }),
          feld("b", "Netto in " + e, netto, e, { hilfe: "Netto = Brutto − Tara", fehler: [fNetto] })
        ],
        weg: [`Brutto = 100 %`, `Tara: ${zahl(b)} · ${zahl(t / 100)} = ${W(tara)}`, `Netto: ${zahl(b)} − ${zahl(tara)} = ${W(netto)}`],
        probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [b, t]
      };
    }
    const arten = stufe === 2 ? ["vor", "netto", "taraGeg", "prozent"] : ["taraGeg", "gewichte", "einheit"];
    let art = pick(r, arten);
    if (art === "netto" && t === 10) art = "taraGeg";
    const nP = 100 - t;

    if (art === "vor") return {
      titel: c.ding, szene: szene(W(b), "Brutto"),
      text: `Der Lieferschein sagt: ${klein2(c.ding)} wiegt mit Verpackung <b>${W(b)}</b>. Auf die Verpackung entfallen <b>${t}&nbsp;%</b>.`,
      teile: [feld("a", "Tara", tara, e), feld("b", "Netto", netto, e, { fehler: [fNetto] })],
      weg: [`Tara: ${zahl(b)} · ${zahl(t / 100)} = ${W(tara)}`, `Netto: ${zahl(b)} − ${zahl(tara)} = ${W(netto)}`],
      probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [b, t]
    };
    if (art === "netto") return {
      titel: c.ding, szene: szene("?", "Brutto"),
      text: `Auf dem Etikett stehen <b>${W(netto)}</b> ${c.inhalt}. Das sind <b>${nP}&nbsp;%</b> vom Gesamtgewicht. Was wiegt alles zusammen, und was wiegt die Verpackung?`,
      teile: [
        feld("a", "Brutto", b, e, { fehler: [{ wert: rund(netto * (1 + t / 100)), tol: 0.02, msg: `Du hast ${t} % draufgerechnet. Aber ${W(netto)} sind nicht 100 %. Hier gilt: ${W(netto)} sind ${nP} %.` }] }),
        feld("b", "Tara", tara, e)
      ],
      weg: [`${nP} % ≙ ${W(netto)}`, `100 % ≙ ${zahl(netto)} · 100 : ${nP} = ${W(b)}`, `Tara: ${zahl(b)} − ${zahl(netto)} = ${W(tara)}`],
      probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [netto, nP]
    };
    if (art === "taraGeg") return {
      titel: c.ding, szene: szene("?", "Brutto"),
      text: `In ${klein(c.ding)} sind <b>${W(netto)}</b> ${c.inhalt}. Die Verpackung macht <b>${t}&nbsp;%</b> vom Gesamtgewicht aus. Wie schwer ist alles zusammen, und wie schwer ist die Verpackung?`,
      teile: [
        feld("a", "Brutto", b, e, { fehler: [{ wert: rund(netto * (1 + t / 100)), tol: 0.02, msg: `Die ${t} % beziehen sich aufs Brutto, nicht aufs Netto. Überlege: Wie viel Prozent sind dann die ${W(netto)}?` }] }),
        feld("b", "Tara", tara, e)
      ],
      weg: [`Netto sind 100 % − ${t} % = ${nP} %`, `Brutto: ${zahl(netto)} · 100 : ${nP} = ${W(b)}`, `Tara: ${zahl(b)} − ${zahl(netto)} = ${W(tara)}`],
      probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [netto, t]
    };
    if (art === "prozent") return {
      titel: c.ding, szene: szene(W(b), "Brutto"),
      text: `${c.ding} wiegt <b>${W(b)}</b>. Ohne Verpackung sind es <b>${W(netto)}</b>. Wie viel Prozent vom Brutto ist die Tara?`,
      teile: [feld("a", "Tara in Prozent", t, "%", { fehler: [{ wert: nP, msg: "Das ist der Anteil des Inhalts. Gefragt ist die Verpackung." }] })],
      weg: [`Tara: ${zahl(b)} − ${zahl(netto)} = ${W(tara)}`, `${zahl(tara)} · 100 : ${zahl(b)} = ${t} %`],
      probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [b, netto]
    };
    if (art === "gewichte") return {
      titel: c.ding, szene: szene("?", "Brutto"),
      text: `Bei ${klein(c.ding)} wiegt die Verpackung <b>${W(tara)}</b>. Das sind <b>${t}&nbsp;%</b> vom Brutto. Berechne Brutto und Netto.`,
      teile: [feld("a", "Brutto", b, e), feld("b", "Netto", netto, e, { fehler: [{ wert: b, msg: "Das ist das Brutto. Zieh noch die Verpackung ab." }] })],
      weg: [`${t} % ≙ ${W(tara)}`, `100 % ≙ ${zahl(tara)} · 100 : ${t} = ${W(b)}`, `Netto: ${zahl(b)} − ${zahl(tara)} = ${W(netto)}`],
      probe: { typ: "tara", brutto: b, taraP: t, tara, netto }, zahlen: [tara, t]
    };
    /* einheit: Brutto in kg, Tara in g */
    const kgC = pick(r, [[1.2, 96], [1.5, 75], [2, 160], [2.5, 200], [0.8, 64], [3.2, 256], [1.6, 240], [2.4, 300]]);
    const [kg, g] = kgC, tp = rund(g / (kg * 1000) * 100);
    return {
      titel: "Einheiten umrechnen", szene: szene(einh(kg, "kg"), "Brutto"),
      text: `Eine Dose Kekse wiegt <b>${einh(kg, "kg")}</b>. Die Dose allein wiegt <b>${einh(g, "g")}</b>. Wie viel Prozent ist die Tara?`,
      teile: [feld("a", "Brutto in g", kg * 1000, "g"), feld("b", "Tara in Prozent", tp, "%", { fehler: [{ wert: rund(g / kg), tol: 0.01, msg: "Achtung: Rechne beide Gewichte zuerst in Gramm um." }] })],
      weg: [`${einh(kg, "kg")} = ${einh(kg * 1000, "g")}`, `${g} · 100 : ${zahl(kg * 1000)} = ${pz(tp)}`],
      probe: { typ: "taraEinheit", kg, g, p: tp }, zahlen: [kg, g]
    };
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const klein = s => s.replace(/^Ein /, "einem ").replace(/^Eine /, "einer ");
  const klein2 = s => s.replace(/^Ein /, "ein ").replace(/^Eine /, "eine ");

  /* ---------- 2 Verwandler ---------- */
  const P_LEICHT = [5, 10, 15, 20, 25, 30, 40, 50, 55, 65, 70, 75, 80, 85, 90, 95];
  const P_MITTEL = [3, 4, 6, 9, 30, 40, 70, 90, 16, 24, 28, 32, 36, 44, 48, 52, 56, 64, 68, 72, 76, 84, 88, 92, 96, 5, 15, 25, 65, 85, 95];
  const P_KNIFFLIG = [12.5, 37.5, 62.5, 87.5, 2.5, 22.5, 125, 150, 175];

  function gesichter(p) {
    const skal = ganz(p) ? 1 : 10;
    let z = p * skal, n = 100 * skal; const g = ggt(Math.round(z), n); z = Math.round(z) / g; n = n / g;
    return { p, z, n, dez: rund(p / 100), hz: p };
  }

  function verwandler(r, stufe) {
    if (stufe === 1 || (stufe === 3 && r() < 0.35)) {
      const pool = stufe === 1 ? P_LEICHT : P_MITTEL.concat(P_KNIFFLIG.filter(x => x < 100));
      const werte = mischen(r, pool).slice(0, stufe === 1 ? 2 : 3);
      const sets = werte.map(p => {
        const f = gesichter(p);
        return { p, karten: [{ art: "bruch", z: f.z, n: f.n }, ganz(p) ? { art: "bruch", z: p, n: 100 } : { art: "text", t: zahl(p) + "/100" }, { art: "text", t: zahl(f.dez) }, { art: "text", t: pz(p) }] };
      });
      return {
        titel: "Finde die Vierlinge", spiel: true,
        text: `Jede Zahl hat vier Gesichter: Bruch, Hundertstelbruch, Dezimalbruch und Prozent. Tippe immer die <b>vier Karten</b> an, die denselben Wert haben.`,
        teile: [{ art: "vierling", id: "a", sets }],
        weg: sets.map(s => { const f = gesichter(s.p); return `${f.z}/${f.n} = ${zahl(s.p)}/100 = ${zahl(f.dez)} = ${pz(s.p)}`; }),
        probe: { typ: "vierling", werte }, zahlen: werte
      };
    }
    const p = stufe === 2 ? pick(r, P_MITTEL) : pick(r, P_KNIFFLIG);
    const f = gesichter(p);
    const mitHundert = ganz(p);
    const start = pick(r, mitHundert ? ["bruch", "dez", "prozent"] : ["bruch", "prozent"]);
    const gegeben = { bruch: `<span class="b"><i>${f.z}</i><i>${f.n}</i></span>`, dez: zahl(f.dez), prozent: pz(p) }[start];
    const teile = [];
    if (start !== "bruch") teile.push({ art: "bruch", id: "b", label: p > 100 ? "Bruch, am besten gekürzt (darf größer als 1 sein)" : "Bruch, am besten gekürzt", z: f.z, n: f.n, gekuerzt: true });
    if (mitHundert) teile.push(feld("h", "Hundertstelbruch: Trage den Zähler ein", p, "/100"));
    if (start !== "dez") teile.push(feld("d", "Dezimalbruch", f.dez, "", { fehler: [{ wert: p, msg: "Das wäre die Prozentzahl. Beim Dezimalbruch steht das Komma zwei Stellen weiter links." }, { wert: rund(f.dez / 10), tol: 1e-6, msg: "Eine Stelle zu weit. Das Komma rückt nur um zwei Stellen." }] }));
    if (start !== "prozent") teile.push(feld("p", "Prozent", p, "%"));
    return {
      titel: "Verwandle die Zahl", szene: { typ: "karte", gegeben },
      text: `Diese Zahl ist gegeben. Finde ihre anderen Gesichter.`,
      teile,
      weg: [`${f.z}/${f.n} = ${zahl(p)}/100`, `${zahl(p)}/100 = ${zahl(f.dez)}`, `${zahl(f.dez)} = ${pz(p)}`],
      probe: { typ: "gesicht", p, z: f.z, n: f.n, dez: f.dez }, zahlen: [p]
    };
  }

  /* ---------- 3 Detektei ---------- */
  const FAELLE = [
    { ort: "Tierpark", g: "Tiere", t: "Vögel", s: ["Im Tierpark leben {G} Tiere. {P} % davon sind Vögel.", "Wie viele Vögel sind das?"], u: ["Im Tierpark leben {W} Vögel. Das sind {P} % aller Tiere.", "Wie viele Tiere leben dort insgesamt?"], q: ["Im Tierpark leben {G} Tiere. {W} davon sind Vögel.", "Wie viel Prozent sind Vögel?"], rest: "keine Vögel" },
    { ort: "Kino", g: "Plätze", t: "besetzt", s: ["Das Kino hat {G} Plätze. {P} % sind heute besetzt.", "Wie viele Plätze sind besetzt?"], u: ["Im Kino sind {W} Plätze besetzt. Das sind {P} % aller Plätze.", "Wie viele Plätze hat das Kino?"], q: ["Das Kino hat {G} Plätze. {W} sind besetzt.", "Wie viel Prozent sind besetzt?"], rest: "frei" },
    { ort: "Bücherei", g: "Bücher", t: "ausgeliehen", s: ["Die Bücherei hat {G} Bücher. {P} % sind gerade ausgeliehen.", "Wie viele Bücher sind ausgeliehen?"], u: ["In der Bücherei sind {W} Bücher ausgeliehen. Das sind {P} % aller Bücher.", "Wie viele Bücher hat die Bücherei?"], q: ["Die Bücherei hat {G} Bücher. {W} sind ausgeliehen.", "Wie viel Prozent sind ausgeliehen?"], rest: "im Regal" },
    { ort: "Freibad", g: "Gäste", t: "Kinder", s: ["Im Freibad sind heute {G} Gäste. {P} % davon sind Kinder.", "Wie viele Kinder sind im Freibad?"], u: ["Im Freibad sind {W} Kinder. Das sind {P} % aller Gäste.", "Wie viele Gäste sind es insgesamt?"], q: ["Im Freibad sind {G} Gäste. {W} davon sind Kinder.", "Wie viel Prozent sind Kinder?"], rest: "Erwachsene" },
    { ort: "Konzert", g: "Karten", t: "verkauft", s: ["Für das Konzert gibt es {G} Karten. {P} % sind schon verkauft.", "Wie viele Karten sind verkauft?"], u: ["Für das Konzert sind {W} Karten verkauft. Das sind {P} % aller Karten.", "Wie viele Karten gibt es insgesamt?"], q: ["Für das Konzert gibt es {G} Karten. {W} sind verkauft.", "Wie viel Prozent sind verkauft?"], rest: "noch zu haben" },
    { ort: "Bäckerei", g: "Brezen", t: "verkauft", s: ["Die Bäckerei backt {G} Brezen. {P} % sind bis Mittag verkauft.", "Wie viele Brezen sind verkauft?"], u: ["Die Bäckerei hat bis Mittag {W} Brezen verkauft. Das sind {P} % aller Brezen.", "Wie viele Brezen hat sie gebacken?"], q: ["Die Bäckerei backt {G} Brezen. {W} sind bis Mittag verkauft.", "Wie viel Prozent sind verkauft?"], rest: "übrig" }
  ];
  const D_G1 = [200, 300, 400, 500, 1000];
  const D_G = [240, 320, 360, 480, 500, 600, 720, 800, 900, 1250, 1500, 2400];
  const D_P = [5, 8, 10, 12, 15, 16, 20, 24, 25, 30, 32, 35, 40, 45, 55, 60, 65, 70, 75];
  const D_P3 = [2.5, 12.5, 17.5, 27.5, 37.5, 62.5];
  const GESUCHT = ["Grundwert", "Prozentwert", "Prozentsatz"];

  function detektei(r, stufe) {
    for (;;) {
      const f = pick(r, FAELLE), G = pick(r, stufe === 1 ? D_G1 : D_G), P = pick(r, stufe === 3 ? D_P3 : D_P), W = rund(G * P / 100);
      if (!ganz(W)) continue;
      const fill = s => s.replace("{G}", `<b>${zahl(G)}</b>`).replace("{P}", `<b>${zahl(P)}</b>`).replace("{W}", `<b>${zahl(W)}</b>`);
      const art = pick(r, ["s", "u", "q"]);
      const idx = { s: 1, u: 0, q: 2 }[art];
      const [a, b] = f[art];
      const lsg = { s: W, u: G, q: P }[art], e = art === "q" ? "%" : "";
      const weg = {
        s: [`Prozentwert gesucht. 100 % ≙ ${zahl(G)}`, `${zahl(G)} · ${zahl(P)} : 100 = ${zahl(W)}`],
        u: [`Grundwert gesucht. ${zahl(P)} % ≙ ${zahl(W)}`, `${zahl(W)} · 100 : ${zahl(P)} = ${zahl(G)}`],
        q: [`Prozentsatz gesucht. 100 % ≙ ${zahl(G)}`, `${zahl(W)} · 100 : ${zahl(G)} = ${zahl(P)} %`]
      }[art];
      const falsch = {
        s: [{ wert: rund(G / P * 100), tol: 0.5, msg: "Du hast geteilt. Der Teil muss kleiner sein als das Ganze." }],
        u: [{ wert: rund(W * P / 100), tol: 0.5, msg: `Das ist ${zahl(P)} % von ${zahl(W)}. Aber ${zahl(W)} ist nur der Teil, nicht das Ganze.` }],
        q: [{ wert: rund(G / W), tol: 0.05, msg: "Grund und Teil sind vertauscht. Rechne Teil · 100 : Grundwert." }]
      }[art];
      if (stufe === 3 && r() < 0.5) {
        const rest = G - W, restP = 100 - P;
        if (!ganz(rest)) continue;
        return {
          titel: "Fall: " + f.ort, szene: { typ: "akte", ort: f.ort },
          text: `${fill(f.s[0])} Alle anderen sind ${f.rest}.`,
          teile: [feld("a", "Wie viel Prozent sind das?", restP, "%"), feld("b", "Wie viele sind das?", rest, f.g)],
          weg: [`100 % − ${zahl(P)} % = ${zahl(restP)} %`, `${zahl(G)} · ${zahl(restP)} : 100 = ${zahl(rest)}`],
          probe: { typ: "rest", G, P, rest, restP }, zahlen: [G, P]
        };
      }
      const teile = [];
      teile.push(wahl("t", "Was wird gesucht?", GESUCHT, idx, {}));
      teile.push(feld("a", b, lsg, e || f.g, { fehler: falsch, hilfe: stufe === 1 ? "Tabelle % | Menge. 100 % steht beim Grundwert. Über Kreuz rechnen." : "" }));
      return {
        titel: "Fall: " + f.ort, szene: { typ: "akte", ort: f.ort }, nacheinander: stufe === 1,
        text: fill(a), teile, weg,
        probe: { typ: "grund", art, G, P, W, lsg }, zahlen: [G, P, W]
      };
    }
  }

  /* ---------- 4 Kreis-Studio ---------- */
  const UMFRAGEN = [
    { titel: "Haustiere", frage: "welches Haustier sie haben", k: ["Hund", "Katze", "Fische", "Hamster", "keins"], wer: "Jugendliche", dat: "Jugendlichen" },
    { titel: "Ferienziel", frage: "wo sie am liebsten Ferien machen", k: ["Meer", "Berge", "Stadt", "Bauernhof", "daheim"], wer: "Familien", dat: "Familien" },
    { titel: "Eisdiele", frage: "welche Eissorte sie am liebsten essen", k: ["Vanille", "Schoko", "Erdbeere", "Zitrone", "Nuss"], wer: "Gäste", dat: "Gästen" },
    { titel: "Lieblingsfach", frage: "was ihr Lieblingsfach ist", k: ["Mathe", "Kunst", "Englisch", "Biologie", "Werken"], wer: "Kinder", dat: "Kindern" },
    { titel: "Handy", frage: "welche App sie am meisten nutzen", k: ["Video", "Chat", "Spiele", "Foto", "Karten"], wer: "Personen", dat: "Personen" }
  ];
  const ANTEILE = [[45, 25, 20, 10], [50, 25, 15, 10], [30, 30, 25, 15], [40, 35, 15, 10], [55, 20, 15, 10], [45, 30, 15, 10], [50, 30, 20], [60, 25, 15], [40, 40, 20], [35, 25, 25, 15], [30, 25, 20, 15, 10], [40, 25, 15, 15, 5], [45, 20, 15, 15, 5], [25, 25, 25, 15, 10]];
  const K_T = [20, 60, 80, 120, 160, 200, 240, 300, 400];

  function kreisZiehen(r) {
    const u = pick(r, UMFRAGEN), a = pick(r, ANTEILE), T = pick(r, K_T);
    const namen = u.k.slice(0, a.length);
    const anzahl = a.map(x => T * x / 100), winkel = a.map(x => x * 3.6);
    return { u, a, T, namen, anzahl, winkel };
  }

  function kreisTabelle(d, offenP, offenW) {
    return { typ: "tabelle", kopf: ["", ...d.namen], zeilen: [
      ["Anzahl", ...d.anzahl.map(x => zahl(x))],
      ["Prozent", ...d.a.map((x, i) => offenP.includes(i) ? "?" : pz(x))],
      ["Winkel", ...d.winkel.map((x, i) => offenW.includes(i) ? "?" : zahl(x) + "°")]
    ] };
  }

  function kreis(r, stufe, opt) {
    opt = opt || {};
    const d = kreisZiehen(r);
    const intro = `Bei einer Umfrage unter <b>${zahl(d.T)} ${d.u.dat}</b> ging es darum, ${d.u.frage}.`;
    if (stufe === 1) {
      const i = Math.floor(r() * d.a.length);
      return {
        titel: d.u.titel, szene: kreisTabelle(d, [i], [i]), nacheinander: true, text: intro,
        teile: [
          feld("a", `Prozent für ${d.namen[i]}`, d.a[i], "%", { hilfe: `Anzahl · 100 : Gesamtzahl`, fehler: [{ wert: d.anzahl[i], msg: "Das ist die Anzahl aus der Tabelle. Gesucht ist ihr Anteil in Prozent." }] }),
          feld("b", `Winkel für ${d.namen[i]}`, d.winkel[i], "°", { hilfe: `Der ganze Kreis hat 360°. Rechne 360° · ${zahl(d.a[i] / 100)}.`, fehler: [{ wert: d.a[i], msg: "Das sind die Prozent. Rechne sie in Grad um." }] })
        ],
        weg: [`${zahl(d.anzahl[i])} · 100 : ${zahl(d.T)} = ${pz(d.a[i])}`, `360° · ${zahl(d.a[i] / 100)} = ${zahl(d.winkel[i])}°`],
        probe: { typ: "kreis", T: d.T, anzahl: d.anzahl, a: d.a, winkel: d.winkel }, zahlen: [d.T, ...d.anzahl]
      };
    }
    if (stufe === 3 && r() < 0.7) {
      const i = Math.floor(r() * d.a.length);
      const art = pick(r, ["gesamt", "anzahl"]);
      if (art === "gesamt") return {
        titel: d.u.titel + " rückwärts", szene: { typ: "kreisbild", winkel: d.winkel, namen: d.namen, nur: i },
        text: `Im Kreisdiagramm hat der Sektor <b>${d.namen[i]}</b> einen Winkel von <b>${zahl(d.winkel[i])}°</b>. Das sind <b>${zahl(d.anzahl[i])}</b> ${d.u.wer}.`,
        teile: [feld("a", "Anteil in Prozent", d.a[i], "%"), feld("b", "So viele wurden insgesamt gefragt", d.T, "")],
        weg: [`${zahl(d.winkel[i])}° : 360° = ${zahl(d.a[i] / 100)} = ${pz(d.a[i])}`, `${zahl(d.anzahl[i])} · 100 : ${zahl(d.a[i])} = ${zahl(d.T)}`],
        probe: { typ: "kreisRueck", w: d.winkel[i], n: d.anzahl[i], a: d.a[i], T: d.T }, zahlen: [d.winkel[i], d.anzahl[i]]
      };
      return {
        titel: d.u.titel + " rückwärts", szene: { typ: "kreisbild", winkel: d.winkel, namen: d.namen, nur: i },
        text: `<b>${zahl(d.T)} ${d.u.wer}</b> wurden gefragt. Der Sektor <b>${d.namen[i]}</b> hat einen Winkel von <b>${zahl(d.winkel[i])}°</b>. Wie viele ${d.u.wer} sind das?`,
        teile: [feld("a", "Anteil in Prozent", d.a[i], "%"), feld("b", "Anzahl", d.anzahl[i], "")],
        weg: [`${zahl(d.winkel[i])}° : 360° = ${zahl(d.a[i] / 100)} = ${pz(d.a[i])}`, `${zahl(d.T)} · ${zahl(d.a[i])} : 100 = ${zahl(d.anzahl[i])}`],
        probe: { typ: "kreisRueck", w: d.winkel[i], n: d.anzahl[i], a: d.a[i], T: d.T }, zahlen: [d.winkel[i], d.T]
      };
    }
    const idx = d.a.map((_, i) => i);
    const teile = [];
    let szeneK, text = intro, weg;
    if (r() < 0.3) {
      /* Nur Rohdaten: Die Winkel entstehen direkt aus den Anzahlen. */
      text = `${intro} Das Ergebnis: ${d.namen.map((n, i) => `${n} <b>${zahl(d.anzahl[i])}</b>`).join(", ")}. Berechne alle Winkel für das Kreisdiagramm.`;
      idx.forEach(i => teile.push(feld("w" + i, `Winkel ${d.namen[i]}`, d.winkel[i], "°", { fehler: [{ wert: d.a[i], msg: "Das sind die Prozent. Rechne sie in Grad um." }, { wert: d.anzahl[i], msg: "Das ist die Anzahl. Rechne erst den Anteil aus." }] })));
      szeneK = null;
      weg = [...idx.map(i => `${d.namen[i]}: ${zahl(d.anzahl[i])} : ${zahl(d.T)} · 360° = ${zahl(d.winkel[i])}°`), "Probe: Alle Winkel zusammen ergeben 360°."];
    } else {
      const zahlOffen = () => 1 + Math.floor(r() * Math.min(3, idx.length - 1));
      const offenP = mischen(r, idx).slice(0, zahlOffen()).sort();
      const offenW = mischen(r, idx).slice(0, zahlOffen()).sort();
      offenP.forEach(i => teile.push(feld("p" + i, `Prozent ${d.namen[i]}`, d.a[i], "%")));
      offenW.forEach(i => teile.push(feld("w" + i, `Winkel ${d.namen[i]}`, d.winkel[i], "°", { fehler: [{ wert: d.a[i], msg: "Das sind die Prozent. Rechne sie in Grad um." }] })));
      szeneK = kreisTabelle(d, offenP, offenW);
      weg = [...offenP.map(i => `${d.namen[i]}: ${zahl(d.anzahl[i])} · 100 : ${zahl(d.T)} = ${pz(d.a[i])}`), ...offenW.map(i => `${d.namen[i]}: 360° · ${zahl(d.a[i] / 100)} = ${zahl(d.winkel[i])}°`), "Probe: Alle Winkel zusammen ergeben 360°."];
    }
    if (!opt.ohneZeichnen) {
      const mode = opt.modus || pick(r, ["ziehen", "heft"]);
      if (mode === "ziehen") teile.push({ art: "kreis", id: "k", label: "Zieh die Sektoren in den Kreis", winkel: d.winkel, namen: d.namen });
      else teile.push({ art: "selbst", id: "k", label: "Zeichne den Kreis mit dem Geodreieck ins Heft. Beginne mit einem Radius nach oben, zeichne im Uhrzeigersinn und beschrifte die Sektoren. Zeig dir dann das Muster und vergleiche.", winkel: d.winkel, namen: d.namen, knopf: "Passt, auf 2° genau" });
    }
    return {
      titel: d.u.titel, szene: szeneK, text, teile, weg,
      probe: { typ: "kreis", T: d.T, anzahl: d.anzahl, a: d.a, winkel: d.winkel }, zahlen: [d.T, ...d.anzahl]
    };
  }

  /* ---------- 5 Preis-Maschine ---------- */
  const DINGE = [
    { n: "Sneaker", s: "Die Sneaker kosten", p: "Die Sneaker", b: [60, 80, 90, 120, 180, 200] },
    { n: "Abo", s: "Das Streaming-Abo kostet im Jahr", p: "Das Abo", b: [60, 80, 90, 120, 180] },
    { n: "Konzertkarte", s: "Die Konzertkarte kostet", p: "Die Karte", b: [40, 60, 80, 90, 120] },
    { n: "Skateboard", s: "Das Skateboard kostet", p: "Das Skateboard", b: [60, 80, 90, 120, 180, 200] },
    { n: "Kopfhörer", s: "Die Kopfhörer kosten", p: "Die Kopfhörer", b: [40, 60, 80, 120, 180, 200, 280, 320] },
    { n: "Konsole", s: "Die Spielekonsole kostet", p: "Die Konsole", b: [280, 320, 360, 400, 450, 480, 500, 600] },
    { n: "Rucksack", s: "Der Rucksack kostet", p: "Der Rucksack", b: [40, 60, 80, 90] }
  ];
  const P_P = [5, 8, 10, 15, 20, 25, 30, 35, 40, 45];

  function preisZiehen(r) {
    for (;;) {
      const d = pick(r, DINGE), alt = pick(r, d.b), p = pick(r, P_P), hoch = r() < 0.5;
      const f = rund(1 + (hoch ? p : -p) / 100), neu = rund(alt * f);
      if (nachkomma(neu, 2)) return { d, alt, p, hoch, f, neu };
    }
  }

  function preis(r, stufe) {
    const { d, alt, p, hoch, f, neu } = preisZiehen(r);
    const szene = (e, m, a) => ({ typ: "maschine", ein: e, faktor: m, aus: a });
    const wort = hoch ? "steigt" : "sinkt";
    if (stufe === 1) return {
      titel: d.n, szene: szene(euro(alt), "?", "?"), nacheinander: true,
      text: `${d.s} <b>${euro(alt)}</b>. Der Preis ${wort} um <b>${p}&nbsp;%</b>.`,
      teile: [
        feld("a", "Welcher Faktor kommt in die Maschine?", f, "", { hilfe: hoch ? `100 % + ${p} % = ${100 + p} %` : `100 % − ${p} % = ${100 - p} %`, fehler: [{ wert: p / 100, tol: 1e-6, msg: "Das ist nur die Änderung. Die Maschine braucht den ganzen neuen Anteil." }, { wert: rund(1 - (hoch ? p : -p) / 100), tol: 1e-6, msg: "Prüfe die Richtung: Steigt der Preis, ist der Faktor größer als 1." }] }),
        feld("b", "Neuer Preis", neu, "€")
      ],
      weg: [`Faktor: ${zahl(f)}`, `${euro(alt)} · ${zahl(f)} = ${euro(neu)}`],
      probe: { typ: "preis", alt, p, hoch, neu }, zahlen: [alt, p, neu]
    };
    const arten = stufe === 2 ? ["vor", "prozent", "zurueck", "doktor"] : ["zurueck", "doktor", "zwei"];
    const art = pick(r, arten);
    if (art === "vor") return {
      titel: d.n, szene: szene(euro(alt), "?", "?"),
      text: `${d.s} <b>${euro(alt)}</b>. Der Preis ${wort} um <b>${p}&nbsp;%</b>. Wie hoch ist der neue Preis?`,
      teile: [feld("a", "Neuer Preis", neu, "€", { fehler: [{ wert: rund(alt * p / 100), tol: 0.01, msg: "Das ist nur die Änderung in Euro. Gefragt ist der neue Preis." }] })],
      weg: [`Faktor: ${zahl(f)}`, `${euro(alt)} · ${zahl(f)} = ${euro(neu)}`],
      probe: { typ: "preis", alt, p, hoch, neu }, zahlen: [alt, p, neu]
    };
    if (art === "prozent") return {
      titel: d.n, szene: szene(euro(alt), "?", euro(neu)),
      text: `${d.s} erst <b>${euro(alt)}</b>, jetzt <b>${euro(neu)}</b>. Um wie viel Prozent ${hoch ? "steigt" : "sinkt"} der Preis?`,
      teile: [feld("a", "Änderung in Prozent", p, "%", { fehler: [{ wert: rund(Math.abs(neu - alt) / neu * 100), tol: 0.05, msg: `Bezug prüfen: Der alte Preis (${euro(alt)}) ist der Grundwert.` }, { wert: rund(neu / alt * 100), tol: 0.01, msg: "Das ist der neue Anteil. Gesucht ist die Änderung gegenüber 100 %." }] })],
      weg: [`${zahl(neu)} : ${zahl(alt)} = ${zahl(f)}`, `Faktor ${zahl(f)} heißt ${hoch ? "+" : "−"}${p} %`],
      probe: { typ: "preis", alt, p, hoch, neu }, zahlen: [alt, neu]
    };
    if (art === "zurueck") {
      const falschR = rund(neu * (hoch ? 1 - p / 100 : 1 + p / 100));
      return {
        titel: d.n + " rückwärts", szene: szene("?", hoch ? `+${p} %` : `−${p} %`, euro(neu)),
        text: `${d.s} nach einer ${hoch ? "Erhöhung" : "Senkung"} um <b>${p}&nbsp;%</b> jetzt <b>${euro(neu)}</b>. Wie hoch war der Preis vorher?`,
        teile: [feld("a", "Preis vorher", alt, "€", { fehler: [{ wert: falschR, tol: 0.011, msg: `Du hast ${p} % ${hoch ? "abgezogen" : "draufgerechnet"}. Aber ${euro(neu)} ist nicht der Grundwert. Teile durch den Faktor.` }] })],
        weg: [`Faktor: ${zahl(f)}`, `${euro(neu)} : ${zahl(f)} = ${euro(alt)}`],
        probe: { typ: "preis", alt, p, hoch, neu }, zahlen: [neu, p]
      };
    }
    if (art === "doktor") {
      const stimmt = r() < 0.34;
      const form = stimmt ? "richtig" : pick(r, ["rechnung", "rueck"]);
      let zeile, lsgWert;
      if (form === "richtig") { zeile = `${euro(alt)} · ${zahl(f)} = ${euro(neu)}`; lsgWert = neu; }
      else if (form === "rechnung") { const falsch = rund(alt + (hoch ? 1 : -1) * p); zeile = `${euro(alt)} ${hoch ? "+" : "−"} ${p} = ${euro(falsch)}`; lsgWert = neu; }
      else { const falsch = rund(neu * (hoch ? 1 - p / 100 : 1 + p / 100)); zeile = `Vorher: ${euro(neu)} · ${zahl(hoch ? 1 - p / 100 : 1 + p / 100)} = ${euro(falsch)}`; lsgWert = alt; }
      return {
        titel: "Fehlerdoktor: " + d.n, szene: { typ: "doktor", zeile },
        text: form === "rueck" ? `Der Preis hat sich um ${p}&nbsp;% ${hoch ? "erhöht" : "gesenkt"} und liegt jetzt bei <b>${euro(neu)}</b>. Eine Person rechnet den alten Preis so aus. Stimmt das?` : `${d.s} ${euro(alt)}, der Preis ${wort} um ${p}&nbsp;%. Eine Person rechnet so. Stimmt das?`,
        teile: [wahl("t", "Stimmt die Rechnung?", ["Ja", "Nein"], stimmt ? 0 : 1), feld("a", "Richtiges Ergebnis (stimmt die Rechnung, trag es trotzdem ein)", lsgWert, "€")],
        weg: form === "rueck" ? [`${euro(neu)} ist nicht der Grundwert.`, `${euro(neu)} : ${zahl(f)} = ${euro(alt)}`] : [`Faktor ${zahl(f)}`, `${euro(alt)} · ${zahl(f)} = ${euro(neu)}`],
        probe: { typ: "doktor", alt, p, hoch, neu, form, lsg: lsgWert, stimmt }, zahlen: [alt, p, neu]
      };
    }
    /* zwei Änderungen */
    for (;;) {
      const a = pick(r, [100, 200, 300, 400, 500, 600, 800]), p1 = pick(r, [10, 20, 25, 50]), p2 = pick(r, [5, 10, 20, 40]);
      const zw = rund(a * (1 + p1 / 100)), ende = rund(zw * (1 - p2 / 100));
      if (!nachkomma(ende, 2)) continue;
      const gesamt = rund((ende / a - 1) * 100);
      return {
        titel: "Rauf und runter", szene: szene(euro(a), "2 Schritte", "?"),
        text: `Eine Flugreise kostet <b>${euro(a)}</b>. Der Preis steigt um <b>${p1}&nbsp;%</b>. Danach sinkt der neue Preis um <b>${p2}&nbsp;%</b>.`,
        teile: [feld("a", "Preis am Ende", ende, "€", { fehler: [{ wert: rund(a * (1 + (p1 - p2) / 100)), tol: 0.01, msg: "Die zweite Änderung bezieht sich auf den neuen Preis, nicht auf den alten." }] }), feld("b", "Änderung insgesamt in Prozent (Minus eintippen, wenn es billiger wird)", gesamt, "%", { tol: 0.06 })],
        weg: [`${euro(a)} · ${zahl(1 + p1 / 100)} = ${euro(zw)}`, `${euro(zw)} · ${zahl(1 - p2 / 100)} = ${euro(ende)}`, `${zahl(ende)} : ${zahl(a)} = ${zahl(ende / a)}, also ${zahl(gesamt)} %`],
        probe: { typ: "zwei", a, p1, p2, ende, gesamt }, zahlen: [a, p1, p2]
      };
    }
  }

  /* ---------- 6 Kassenbon ---------- */
  const BON = [
    { n: "Fahrradwerkstatt", was: "Reparatur", b: [200, 300, 400, 600] }, { n: "Malerbetrieb", was: "Wohnzimmer streichen", b: [800, 900, 1000, 1600] }, { n: "Online-Shop", was: "Bestellung", b: [200, 300, 400, 600, 800] },
    { n: "Gärtnerei", was: "Hecke schneiden", b: [300, 400, 600, 800] }, { n: "Computerladen", was: "Drucker und Monitor", b: [600, 800, 900, 1000] }, { n: "Elektrik Maier", was: "Lampen montieren", b: [300, 400, 600, 800, 900] },
    { n: "Hofladen", was: "Lebensmittel fürs Sommerfest", b: [200, 300, 400, 600], steuer: 7 }
  ];

  /* Rechnet in Cent, damit keine Rundungsfehler entstehen. Gibt null zurück, wenn ein Schritt nicht aufgeht. */
  function bonRechnen(startCent, schritte) {
    let c = startCent; const zeilen = [];
    for (const s of schritte) {
      const betrag = c * s.p / 100;
      if (!ganz(betrag)) return null;
      const neu = s.art === "plus" ? c + betrag : c - betrag;
      zeilen.push({ s, betrag: betrag / 100, neu: neu / 100, grund: c / 100 });
      c = neu;
    }
    return zeilen;
  }

  function bon(r, stufe) {
    const FOLGE = {
      1: [[["Rabatt", "minus", 10], ["Umsatzsteuer", "plus", 19]], [["Rabatt", "minus", 20], ["Skonto", "minus", 3]], [["Rabatt", "minus", 25], ["Umsatzsteuer", "plus", 19]]],
      2: [[["Rabatt", "minus", 15], ["Umsatzsteuer", "plus", 19]], [["Rabatt", "minus", 25], ["Skonto", "minus", 2]], [["Rabatt", "minus", 10], ["Skonto", "minus", 3]], [["Rabatt", "minus", 20], ["Umsatzsteuer", "plus", 19]]],
      3: [[["Rabatt", "minus", 10], ["Umsatzsteuer", "plus", 19], ["Skonto", "minus", 2]], [["Rabatt", "minus", 20], ["Umsatzsteuer", "plus", 19], ["Skonto", "minus", 3]], [["Rabatt", "minus", 25], ["Umsatzsteuer", "plus", 19], ["Skonto", "minus", 2]], [["Rabatt", "minus", 15], ["Skonto", "minus", 2], ["Umsatzsteuer", "plus", 19]]]
    };
    for (;;) {
      const c = pick(r, BON), B = pick(r, c.b);
      const roh = c.steuer && stufe > 1 && r() < 0.5 ? [["Umsatzsteuer", "plus", 7], ["Skonto", "minus", 3]] : pick(r, FOLGE[stufe]);
      const folge = roh.map(([name, art, p]) => ({ name, art, p: name === "Umsatzsteuer" && c.steuer ? c.steuer : p }));
      const z = bonRechnen(B * 100, folge);
      if (!z) continue;
      const startName = folge[0].name === "Umsatzsteuer" ? "Nettopreis" : "Listenpreis";
      const teile = [];
      z.forEach((x, i) => {
        const zeichen = x.s.art === "plus" ? "+" : "−";
        const alsFalsch = rund(B * x.s.p / 100);
        const fehler = i > 0 && Math.abs(alsFalsch - x.betrag) > 0.005 ? [{ wert: alsFalsch, tol: 0.005, msg: `Du hast ${x.s.p} % vom ersten Betrag genommen. Der Grundwert ist hier die Zeile darüber: ${euro(x.grund)}.` }] : [];
        teile.push(feld("z" + i, `${zeichen} ${x.s.p} % ${x.s.name}`, x.betrag, "€", { egal: true, fehler, hilfe: stufe === 1 ? `Grundwert ist ${euro(x.grund)}.` : "" }));
        const zwName = i === z.length - 1 ? (x.s.name === "Umsatzsteuer" ? "= Bruttopreis" : "= Zahlbetrag") : (x.s.name === "Umsatzsteuer" ? "= Bruttopreis" : "= neuer Preis");
        teile.push(feld("s" + i, zwName, x.neu, "€"));
      });
      const ende = z[z.length - 1].neu, gesamt = rund(ende / B * 100 - 100, 4);
      const gefragt = stufe > 1 && r() < 0.6;
      if (gefragt) {
        const addiert = folge.reduce((s, f) => s + (f.art === "plus" ? f.p : -f.p), 0);
        teile.push(feld("g", `Um wie viel Prozent liegt der Endbetrag über dem ${startName}? Liegt er darunter, tippe ein Minus. Runde auf eine Kommastelle.`, gesamt, "%", { tol: 0.08, fehler: [{ wert: addiert, tol: 0.001, msg: "Du hast die Prozente nur zusammengezählt. Jeder Schritt hat aber einen neuen Grundwert. Rechne Endbetrag : Startbetrag." }] }));
      }
      return {
        titel: c.n, layout: "bon", nacheinander: stufe === 1,
        szene: { typ: "bon", firma: c.n, was: c.was, start: euro(B), startName },
        text: `Die Firma <b>${c.n}</b> schreibt einen Bon. Fülle ihn Zeile für Zeile aus und trage die Beträge ohne Vorzeichen ein.${folge.some(f => f.name === "Skonto") ? " Der Kunde zahlt sofort und bekommt deshalb Skonto." : ""}`,
        teile,
        weg: [...z.map(x => `${x.s.p} % von ${euro(x.grund)} = ${euro(x.betrag)}, das ergibt ${euro(x.neu)}`), ...(gefragt ? [`${zahl(ende)} : ${zahl(B)} = ${zahl(ende / B)}, also ${zahl(gesamt)} %`] : [])],
        probe: { typ: "bon", B, folge, zeilen: z.map(x => [x.betrag, x.neu]), gesamt, gefragt }, zahlen: [B, ...folge.map(f => f.p)]
      };
    }
  }

  /* ---------- 7 Promille-Labor ---------- */
  const LEUTE = [["Frau Demir", "sie", "ihr"], ["Herr Vogel", "er", "sein"], ["Frau Lindner", "sie", "ihr"], ["Herr Kurz", "er", "sein"], ["Frau Weiß", "sie", "ihr"], ["Herr Öztürk", "er", "sein"]];
  const PROBEN = [
    { n: "Gartenteich", was: "Eine Wasserprobe aus dem Gartenteich", stoff: "Pflegemittel", grenze: 0.8, s: [0.3, 0.4, 0.7, 0.9, 1.2, 1.4], l: [4, 4.5, 5, 7, 8] },
    { n: "Aquarium", was: "Eine Wasserprobe aus dem Aquarium", stoff: "Dünger", grenze: 0.3, s: [0.1, 0.2, 0.4, 0.6, 0.7], l: [3, 4, 8, 10, 12] },
    { n: "Pool", was: "Eine Wasserprobe aus dem Pool", stoff: "Reiniger", grenze: 1, s: [0.4, 0.7, 0.9, 1.1, 1.3, 1.5], l: [2, 3, 4, 8, 10] }
  ];

  function salzAufgabe(r, opt) {
    const [s, a, b] = pick(r, [[3, 300, 600], [2, 250, 500], [4, 200, 400], [6, 300, 1000], [5, 250, 1000]]);
    const pa = rund(s / a * 1000), pb = rund(s / b * 1000);
    const warum = opt && opt.ohneZeichnen
      ? wahl("w", "Warum ist der Anteil in Glas A höher?", ["In Glas A ist mehr Salz.", "Gleich viel Salz in weniger Salzwasser: Der Grundwert ist kleiner.", "Glas A ist schmaler."], 1, { 0: "In beiden Gläsern ist gleich viel Salz. Was ist also anders?" })
      : { art: "selbst", id: "w", label: "Warum ist der Anteil in Glas A höher? Schreibe ein bis zwei Sätze ins Heft und vergleiche dann.", muster: "Teil und Grundwert: Der Teil (das Salz) ist gleich, der Grundwert (das Salzwasser) ist in Glas A kleiner. Deshalb ist der Anteil dort größer.", knopf: "Mein Satz passt" };
    return {
      titel: "Salzwasser-Versuch", szene: { typ: "glaeser", a, b, s },
      text: `In zwei Gläsern ist gleich viel Salz: je <b>${s}&nbsp;g</b>. Glas A enthält <b>${a}&nbsp;g</b> Salzwasser, Glas B <b>${zahl(b)}&nbsp;g</b> Salzwasser.`,
      teile: [feld("a", "Salzanteil in Glas A", pa, "‰"), feld("b", "Salzanteil in Glas B", pb, "‰"), warum],
      weg: [`A: ${s} · 1 000 : ${a} = ${pm(pa)}`, `B: ${s} · 1 000 : ${zahl(b)} = ${pm(pb)}`, `Gleicher Teil, kleinerer Grundwert: größerer Anteil.`],
      probe: { typ: "salz", s, a, b, pa, pb }, zahlen: [s, a, b]
    };
  }

  function probeZiehen(r) {
    for (;;) {
      const c = pick(r, PROBEN), l = pick(r, c.l), s = pick(r, c.s), ml = rund(l * s);
      if (nachkomma(ml, 2)) return { c, l, s, ml };
    }
  }

  function promille(r, stufe, opt) {
    const [name, er, sein] = pick(r, LEUTE);
    const szene = (f, t) => ({ typ: "glas", fuell: f, text: t });
    const satzTeile = (c, l, s, ml, voll) => [
      ...(voll ? [feld("a", "Probe in Milliliter", l * 1000, "ml", { hilfe: "1 l = 1 000 ml" })] : []),
      feld("b", "Anteil in Promille", s, "‰", { hilfe: voll ? "Teil · 1 000 : Ganzes. Das ‰ heißt: von Tausend." : "", fehler: [{ wert: rund(ml / (l * 1000) * 100), tol: 1e-4, msg: "Das wäre der Wert in Prozent. Bei Promille rechnest du mal 1 000." }, { wert: rund(ml / l), tol: 1e-4, msg: "Teil und Ganzes brauchen dieselbe Einheit. Rechne die Liter in Milliliter um." }].filter(f => Math.abs(f.wert - s) > 1e-3) }),
      wahl("c", `Ist die Probe in Ordnung? Grenze: ${pm(c.grenze)}`, ["Ja, darunter", "Nein, Grenze erreicht"], s >= c.grenze ? 1 : 0)
    ];
    const satzWeg = (c, l, s, ml) => [`${zahl(l)} l = ${zahl(l * 1000)} ml`, `${zahl(ml)} · 1 000 : ${zahl(l * 1000)} = ${pm(s)}`, s >= c.grenze ? `${pm(s)} erreicht die Grenze von ${pm(c.grenze)}.` : `${pm(s)} liegt unter ${pm(c.grenze)}.`];
    if (stufe === 1) {
      const { c, l, s, ml } = probeZiehen(r);
      return {
        titel: c.n, szene: szene(Math.min(1, s / 1.5), c.stoff), nacheinander: true,
        text: `${c.was}: In <b>${zahl(l)}&nbsp;l</b> Wasser sind <b>${zahl(ml)}&nbsp;ml</b> ${c.stoff}.`,
        teile: satzTeile(c, l, s, ml, true), weg: satzWeg(c, l, s, ml),
        probe: { typ: "satz", l, ml, s, grenze: c.grenze }, zahlen: [ml, l, s, c.grenze]
      };
    }
    const arten = stufe === 2 ? ["satz", "grenze", "versicherung", "medizin", "salz", "salz"] : ["blutmenge", "versRueck", "medizinRueck", "prozent", "salz"];
    const art = pick(r, arten);
    if (art === "salz") return salzAufgabe(r, opt);
    if (art === "satz") {
      const { c, l, s, ml } = probeZiehen(r);
      return {
        titel: c.n, szene: szene(Math.min(1, s / 1.5), c.stoff),
        text: `${c.was}: <b>${zahl(ml)}&nbsp;ml</b> ${c.stoff} in <b>${zahl(l)}&nbsp;l</b> Wasser.`,
        teile: satzTeile(c, l, s, ml, false), weg: satzWeg(c, l, s, ml),
        probe: { typ: "satz", l, ml, s, grenze: c.grenze }, zahlen: [ml, l, s, c.grenze]
      };
    }
    if (art === "grenze") {
      const c = pick(r, PROBEN), l = pick(r, c.l), ml = rund(l * c.grenze);
      return {
        titel: c.n, szene: szene(c.grenze / 1.5, c.stoff),
        text: `Im ${c.n} sind <b>${zahl(l)}&nbsp;l</b> Wasser in der Probe. Ab <b>${pm(c.grenze)}</b> ${c.stoff} muss gewechselt werden. Wie viele Milliliter sind das?`,
        teile: [feld("a", c.stoff, ml, "ml", { fehler: [{ wert: rund(l * 1000 * c.grenze / 100), tol: 0.01, msg: "Du hast durch 100 geteilt. Promille heißt: durch 1 000." }] })],
        weg: [`${zahl(l)} l = ${zahl(l * 1000)} ml`, `${zahl(l * 1000)} · ${zahl(c.grenze)} : 1 000 = ${zahl(ml)} ml`],
        probe: { typ: "wert", g: l * 1000, s: c.grenze, w: ml }, zahlen: [l, c.grenze]
      };
    }
    if (art === "versicherung") {
      const [summe, s] = pick(r, [[150000, 2], [200000, 1.5], [300000, 1.2], [250000, 0.8], [400000, 1.5], [120000, 2.5]]), w = rund(summe * s / 1000);
      return {
        titel: "Versicherung",
        text: `Familie Roth versichert ihr Haus für <b>${euro(summe)}</b>. Der Jahresbeitrag beträgt <b>${pm(s)}</b> dieser Summe.`,
        teile: [feld("a", "Jahresbeitrag", w, "€", { fehler: [{ wert: rund(summe * s / 100), tol: 0.01, msg: "Du hast durch 100 geteilt. Bei Promille teilst du durch 1 000." }] })],
        weg: [`${zahl(summe)} · ${zahl(s)} : 1 000 = ${euro(w)}`], probe: { typ: "wert", g: summe, s, w }, zahlen: [summe, s]
      };
    }
    if (art === "medizin") {
      const [g, s] = pick(r, [[200, 2], [250, 4], [100, 5], [500, 3], [150, 2], [400, 1.5]]), w = rund(g * s / 1000);
      return {
        titel: "Hustensaft", szene: szene(0.6, "Wirkstoff"),
        text: `Eine Flasche Hustensaft enthält <b>${g}&nbsp;ml</b> Saft. Der Wirkstoff macht <b>${pm(s)}</b> davon aus.`,
        teile: [feld("a", "Wirkstoff", w, "ml", { fehler: [{ wert: rund(g * s / 100), tol: 0.001, msg: "Du hast durch 100 geteilt. Promille heißt von Tausend." }] })],
        weg: [`${g} · ${zahl(s)} : 1 000 = ${zahl(w)} ml`], probe: { typ: "wert", g, s, w }, zahlen: [g, s]
      };
    }
    if (art === "blutmenge") {
      const [ml, s] = pick(r, [[2.1, 0.3], [3.5, 0.7], [1.2, 0.2], [4.2, 0.7], [2, 0.4], [5.5, 1.1]]), bl = rund(ml * 1000 / s);
      return {
        titel: name, szene: szene(0.5, "Blutprobe"),
        text: `Das Gerät zeigt bei ${name} <b>${pm(s)}</b>. Das sind <b>${zahl(ml)}&nbsp;ml</b> Alkohol. Wie viel Blut hat ${er}?`,
        teile: [feld("a", "Blut in Milliliter", bl, "ml"), feld("b", "Blut in Liter", bl / 1000, "l")],
        weg: [`${zahl(s)} ‰ ≙ ${zahl(ml)} ml`, `1 000 ‰ ≙ ${zahl(ml)} · 1 000 : ${zahl(s)} = ${zahl(bl)} ml`, `${zahl(bl)} ml = ${zahl(bl / 1000)} l`],
        probe: { typ: "grundP", w: ml, s, g: bl }, zahlen: [ml, s]
      };
    }
    if (art === "versRueck") {
      const [g, s] = pick(r, [[180000, 1.5], [240000, 2], [320000, 1.5], [150000, 0.8], [500000, 1.2]]), w = rund(g * s / 1000);
      return {
        titel: "Versicherung rückwärts",
        text: `Familie Roth zahlt <b>${euro(w)}</b> im Jahr. Das sind <b>${pm(s)}</b> der Versicherungssumme. Wie hoch ist die Summe?`,
        teile: [feld("a", "Versicherungssumme", g, "€")],
        weg: [`${zahl(w)} · 1 000 : ${zahl(s)} = ${euro(g)}`], probe: { typ: "grundP", w, s, g }, zahlen: [w, s]
      };
    }
    if (art === "medizinRueck") {
      const [g, w] = pick(r, [[250, 0.5], [500, 2], [200, 0.6], [400, 1.2], [100, 0.3]]), s2 = rund(w / g * 1000);
      return {
        titel: "Tropfen", szene: szene(0.7, "Wirkstoff"),
        text: `In <b>${g}&nbsp;ml</b> Saft sind <b>${zahl(w)}&nbsp;ml</b> Wirkstoff. Wie viel Promille sind das?`,
        teile: [feld("a", "Promillesatz", s2, "‰")],
        weg: [`${zahl(w)} · 1 000 : ${g} = ${pm(s2)}`], probe: { typ: "satzP", g, w, s: s2 }, zahlen: [g, w]
      };
    }
    const pr = pick(r, [0.3, 0.7, 1.2, 2.5, 15]), prz = rund(pr / 10);
    return {
      titel: "‰ und %",
      text: `Rechne um: <b>${pm(pr)}</b> sind wie viel Prozent? Und wie schreibt man das als Dezimalbruch?`,
      teile: [feld("a", "Prozent", prz, "%", { tol: 1e-4, fehler: [{ wert: rund(pr * 10), tol: 1e-4, msg: "Andersrum: 10 ‰ sind 1 %, also teilst du durch 10." }] }), feld("b", "Dezimalbruch", rund(pr / 1000), "", { tol: 1e-6 })],
      weg: [`${pm(pr)} : 10 = ${pz(prz)}`, `${pm(pr)} = ${zahl(pr)} : 1 000 = ${zahl(pr / 1000)}`], probe: { typ: "umrechnen", pr, prz }, zahlen: [pr]
    };
  }

  /* ---------- 8 Kalkulation: Einkaufspreis bis Bruttoverkaufspreis ---------- */
  const LADEN = [
    { n: "Sportgeschäft", der: "Das", w: "Inliner", akk: "ein Paar Inliner", b: [60, 80, 100, 120, 160] },
    { n: "Musikgeschäft", der: "Das", w: "E-Gitarre", akk: "eine E-Gitarre", b: [200, 240, 300, 400, 500] },
    { n: "Gartencenter", der: "Das", w: "Rasenmäher", akk: "einen Rasenmäher", b: [180, 200, 240, 300, 360] },
    { n: "Spieleladen", der: "Der", w: "Brettspiel", akk: "ein Brettspiel", b: [20, 24, 30, 40] },
    { n: "Elektronikmarkt", der: "Der", w: "Lautsprecher", akk: "einen Lautsprecher", b: [80, 100, 120, 160, 200] },
    { n: "Fahrradladen", der: "Der", w: "Fahrradhelm", akk: "einen Fahrradhelm", b: [40, 50, 60, 80] },
    { n: "Campingladen", der: "Der", w: "Zelt", akk: "ein Zelt", b: [100, 120, 160, 200, 250] }
  ];
  const K_H = [10, 15, 20, 25, 30];
  const K_G = [10, 15, 20, 25, 30, 40];
  const K_V = [10, 20, 25, 30, 40];
  const UST = 19;

  /* Rechnet das Schema in Cent. Nur Ziehungen mit glatten Cent-Beträgen in jeder Zeile. */
  function kalkZiehen(r, verlust) {
    for (;;) {
      const l = pick(r, LADEN), EK = pick(r, l.b), h = pick(r, K_H), p = pick(r, verlust ? K_V : K_G);
      const ek = EK * 100, hk = ek * h / 100, sk = ek + hk, gv = sk * p / 100;
      if (!ganz(hk) || !ganz(gv)) continue;
      const nvp = verlust ? sk - gv : sk + gv, ust = nvp * UST / 100;
      if (!ganz(ust)) continue;
      const c = x => x / 100;
      return { l, EK, h, p, verlust, hk: c(hk), sk: c(sk), gv: c(gv), nvp: c(nvp), ust: c(ust), bvp: c(nvp + ust) };
    }
  }

  function kalk(r, stufe) {
    const arten = stufe === 1 ? ["vor", "rueck"] : stufe === 2 ? ["vor", "rueck", "rueck", "faktor"] : ["vor", "rueck", "rueck", "gewinnP"];
    const art = pick(r, arten);
    const verlust = stufe === 3 && art !== "gewinnP" ? r() < 0.5 : stufe === 2 && art === "vor" ? r() < 0.25 : art === "gewinnP" ? r() < 0.3 : false;
    const k = kalkZiehen(r, verlust);
    const gvName = verlust ? "Verlust" : "Gewinn", gvZ = verlust ? "−" : "+";
    const fG = rund(1 + (verlust ? -k.p : k.p) / 100), fH = rund(1 + k.h / 100), fU = 1.19;
    const probe = { typ: "kalk", art, EK: k.EK, h: k.h, p: k.p, verlust, werte: k };
    const szeneBon = (start, startName) => ({ typ: "bon", firma: k.l.n, was: k.l.w, start: euro(start), startName });
    const kopf = `${k.l.der} <b>${k.l.n}</b> kalkuliert mit <b>${k.h}&nbsp;%</b> Handlungskosten, <b>${k.p}&nbsp;%</b> ${gvName} und <b>${UST}&nbsp;%</b> Umsatzsteuer.`;

    if (art === "vor") {
      const g1 = stufe === 1;
      const gesamt = rund(k.bvp / k.EK * 100 - 100, 4);
      const gefragt = stufe === 3 && r() < 0.5;
      const teile = [
        feld("z0", `+ ${k.h} % Handlungskosten`, k.hk, "€", { egal: true, hilfe: g1 ? `Grundwert ist der Einkaufspreis: ${euro(k.EK)}.` : "" }),
        feld("s0", "= Selbstkosten", k.sk, "€"),
        feld("z1", `${gvZ} ${k.p} % ${gvName}`, k.gv, "€", { egal: true, hilfe: g1 ? `Grundwert sind jetzt die Selbstkosten: ${euro(k.sk)}.` : "", fehler: [{ wert: rund(k.EK * k.p / 100), msg: `Du hast vom Einkaufspreis gerechnet. Der ${gvName} bezieht sich auf die Selbstkosten (${euro(k.sk)}).` }] }),
        feld("s1", "= Nettoverkaufspreis", k.nvp, "€", { fehler: verlust ? [{ wert: rund(k.sk + k.gv), msg: "Bei Verlust ziehst du ab, statt dazuzurechnen." }] : [] }),
        feld("z2", `+ ${UST} % Umsatzsteuer`, k.ust, "€", { egal: true, hilfe: g1 ? `Grundwert ist der Nettoverkaufspreis: ${euro(k.nvp)}.` : "", fehler: [{ wert: rund(k.sk * UST / 100), msg: `Die Umsatzsteuer rechnet mit dem Nettoverkaufspreis (${euro(k.nvp)}), nicht mit den Selbstkosten.` }, { wert: rund(k.EK * UST / 100), msg: `Die Umsatzsteuer rechnet mit dem Nettoverkaufspreis (${euro(k.nvp)}), nicht mit dem Einkaufspreis.` }] }),
        feld("s2", "= Bruttoverkaufspreis", k.bvp, "€")
      ];
      if (gefragt) teile.push(feld("g", "Um wie viel Prozent liegt der Bruttoverkaufspreis über dem Einkaufspreis? Runde auf eine Kommastelle.", gesamt, "%", { tol: 0.08, fehler: [{ wert: k.h + (verlust ? -k.p : k.p) + UST, tol: 0.001, msg: "Du hast die Prozente nur zusammengezählt. Jede Zeile hat aber einen neuen Grundwert. Rechne Bruttoverkaufspreis : Einkaufspreis." }] }));
      return {
        titel: `${k.l.w} kalkulieren`, layout: "bon", nacheinander: g1,
        szene: szeneBon(k.EK, "Einkaufspreis"),
        text: `${kopf} ${k.l.der === "Der" ? "Er" : "Es"} kauft ${k.l.akk} für <b>${euro(k.EK)}</b> ein. Fülle das Kalkulationsschema Zeile für Zeile aus. Beträge ohne Vorzeichen eintragen.`,
        teile,
        weg: [
          `Handlungskosten: ${k.h} % von ${euro(k.EK)} = ${euro(k.hk)}, Selbstkosten ${euro(k.sk)}`,
          `${gvName}: ${k.p} % von ${euro(k.sk)} = ${euro(k.gv)}, Nettoverkaufspreis ${euro(k.nvp)}`,
          `Umsatzsteuer: ${UST} % von ${euro(k.nvp)} = ${euro(k.ust)}, Bruttoverkaufspreis ${euro(k.bvp)}`,
          `Kurz mit Operatoren: ${zahl(k.EK)} · ${zahl(fH)} · ${zahl(fG)} · ${zahl(fU)} = ${euro(k.bvp)}`,
          ...(gefragt ? [`${zahl(k.bvp)} : ${zahl(k.EK)} = ${zahl(rund(k.bvp / k.EK, 4))}, also ${zahl(gesamt)} %`] : [])
        ],
        probe: Object.assign(probe, { gefragt, gesamt }), zahlen: [k.EK, k.h, k.p]
      };
    }

    if (art === "rueck") {
      const fehlNvp = rund(k.bvp * (1 - UST / 100)), fehlSk = rund(k.nvp * (1 + (verlust ? k.p : -k.p) / 100)), fehlEk = rund(k.sk * (1 - k.h / 100));
      const g1 = stufe === 1;
      return {
        titel: `${k.l.w} rückwärts`, layout: "bon", nacheinander: g1,
        szene: szeneBon(k.bvp, "Bruttoverkaufspreis"),
        text: `${kopf} Der Ladenpreis ist <b>${euro(k.bvp)}</b>. Rechne das Schema von unten nach oben zurück bis zum Einkaufspreis.`,
        teile: [
          feld("r0", "Nettoverkaufspreis", k.nvp, "€", { hilfe: g1 ? `Der Ladenpreis sind 119 % vom Nettoverkaufspreis. Rechne ${euro(k.bvp)} : 1,19.` : "", fehler: [{ wert: fehlNvp, tol: 0.011, msg: `Du hast 19 % abgezogen. Aber der Bruttoverkaufspreis ist 119 %, nicht 100 %. Teile durch 1,19.` }] }),
          feld("r1", "Selbstkosten", k.sk, "€", { hilfe: g1 ? `Der Nettoverkaufspreis sind ${100 + k.p} % der Selbstkosten. Teile durch ${zahl(fG)}.` : "", fehler: [{ wert: fehlSk, tol: 0.011, msg: `Der Nettoverkaufspreis ist ${verlust ? 100 - k.p : 100 + k.p} % der Selbstkosten. Teile durch ${zahl(fG)}.` }] }),
          feld("r2", "Einkaufspreis", k.EK, "€", { hilfe: g1 ? `Die Selbstkosten sind ${100 + k.h} % vom Einkaufspreis. Teile durch ${zahl(fH)}.` : "", fehler: [{ wert: fehlEk, tol: 0.011, msg: `Die Selbstkosten sind ${100 + k.h} % vom Einkaufspreis. Teile durch ${zahl(fH)}.` }] })
        ],
        weg: [`${euro(k.bvp)} : ${zahl(fU)} = ${euro(k.nvp)}`, `${euro(k.nvp)} : ${zahl(fG)} = ${euro(k.sk)}`, `${euro(k.sk)} : ${zahl(fH)} = ${euro(k.EK)}`],
        probe, zahlen: [k.bvp, k.h, k.p]
      };
    }

    if (art === "faktor") return {
      titel: `${k.l.w}: mit Operatoren`,
      szene: { typ: "maschine", ein: euro(k.EK), faktor: "3 Faktoren", aus: "?" },
      text: `${kopf} Der Einkaufspreis ist <b>${euro(k.EK)}</b>. Rechne mit den drei Faktoren direkt zum Bruttoverkaufspreis.`,
      teile: [
        feld("f0", "Faktor für die Handlungskosten", fH, "", { tol: 1e-6, fehler: [{ wert: k.h / 100, tol: 1e-6, msg: "Das ist nur der Zuschlag. Der Faktor enthält die 100 % mit." }] }),
        feld("f1", `Faktor für den ${gvName}`, fG, "", { tol: 1e-6, fehler: [{ wert: k.p / 100, tol: 1e-6, msg: "Das ist nur der Zuschlag. Der Faktor enthält die 100 % mit." }] }),
        feld("f2", "Faktor für die Umsatzsteuer", fU, "", { tol: 1e-6, fehler: [{ wert: 0.19, tol: 1e-6, msg: "Das ist nur die Steuer. Der Faktor enthält die 100 % mit." }] }),
        feld("a", "Bruttoverkaufspreis", k.bvp, "€", { fehler: [{ wert: rund(k.EK * (1 + (k.h + k.p + UST) / 100)), tol: 0.011, msg: "Du hast die Prozente zusammengezählt. Nimm die Faktoren nacheinander mal." }] })
      ],
      weg: [`Handlungskosten: ${zahl(fH)}, ${gvName}: ${zahl(fG)}, Umsatzsteuer: ${zahl(fU)}`, `${zahl(k.EK)} · ${zahl(fH)} · ${zahl(fG)} · ${zahl(fU)} = ${euro(k.bvp)}`],
      probe, zahlen: [k.EK, k.h, k.p]
    };

    /* gewinnP: Einkaufspreis, Handlungskosten und Ladenpreis bekannt. Gewinn oder Verlust in Prozent gesucht. */
    return {
      titel: `${k.l.w}: Gewinn oder Verlust?`,
      szene: szeneBon(k.EK, "Einkaufspreis"),
      text: `${k.l.der} <b>${k.l.n}</b> kauft ${k.l.akk} für <b>${euro(k.EK)}</b> ein und rechnet mit <b>${k.h}&nbsp;%</b> Handlungskosten. Der Ladenpreis ist <b>${euro(k.bvp)}</b>, darin sind <b>${UST}&nbsp;%</b> Umsatzsteuer enthalten.`,
      teile: [
        feld("s0", "Selbstkosten", k.sk, "€"),
        feld("r0", "Nettoverkaufspreis", k.nvp, "€", { fehler: [{ wert: rund(k.bvp * (1 - UST / 100)), tol: 0.011, msg: "Der Ladenpreis ist 119 %. Teile durch 1,19, statt 19 % abzuziehen." }] }),
        wahl("t", "Macht das Geschäft Gewinn oder Verlust?", ["Gewinn", "Verlust"], verlust ? 1 : 0, { [verlust ? 0 : 1]: "Vergleiche Nettoverkaufspreis und Selbstkosten. Was ist größer?" }),
        feld("d", `${gvName} in Euro`, k.gv, "€", { egal: true }),
        feld("g", `${gvName} in Prozent der Selbstkosten`, k.p, "%", { egal: true, fehler: [{ wert: rund(k.gv / k.nvp * 100), tol: 0.06, msg: "Grundwert prüfen: Gewinn und Verlust rechnet man von den Selbstkosten." }, { wert: rund(k.gv / k.EK * 100), tol: 0.06, msg: "Grundwert prüfen: nicht der Einkaufspreis, sondern die Selbstkosten sind 100 %." }] })
      ],
      weg: [`Selbstkosten: ${euro(k.EK)} · ${zahl(fH)} = ${euro(k.sk)}`, `Nettoverkaufspreis: ${euro(k.bvp)} : ${zahl(fU)} = ${euro(k.nvp)}`, `${gvName}: ${euro(k.nvp)} − ${euro(k.sk)} = ${verlust ? "−" : ""}${euro(k.gv)}`, `${zahl(k.gv)} · 100 : ${zahl(k.sk)} = ${pz(k.p)}`],
      probe, zahlen: [k.EK, k.h, k.bvp]
    };
  }

  /* ---------- Stationen ---------- */
  const STATIONEN = [
    { id: "preis", name: "Preis-Maschine", motto: "Faktor rein, Preis raus, auch rückwärts", tag: 1, f: preis },
    { id: "verwandler", name: "Verwandler", motto: "Vier Gesichter derselben Zahl", tag: 1, f: verwandler },
    { id: "bon", name: "Kassenbon", motto: "Jede Zeile hat einen neuen Grundwert", tag: 1, f: bon },
    { id: "detektei", name: "Detektei", motto: "Was wird gesucht? Erst denken, dann rechnen", tag: 1, f: detektei },
    { id: "promille", name: "Promille-Labor", motto: "Teile von Tausend", tag: 2, f: promille },
    { id: "lager", name: "Lager", motto: "Brutto, Netto, Tara auf die Waage", tag: 2, f: lager },
    { id: "kreis", name: "Kreis-Studio", motto: "Von der Umfrage zum Kreisdiagramm", tag: 2, f: kreis },
    { id: "kalk", name: "Kalkulation", motto: "Vom Einkaufspreis zum Ladenpreis und zurück", tag: 3, f: kalk }
  ];

  function erzeuge(stationId, stufe, r, opt) {
    const s = STATIONEN.find(x => x.id === stationId);
    const t = s.f(r || Math.random, stufe, opt);
    t.station = stationId; t.stufe = stufe;
    /* Eine Fehlermeldung darf nie auf die richtige Lösung passen. */
    t.teile.forEach(x => { if (x.art === "zahl") x.fehler = x.fehler.filter(f => Math.abs(f.wert - x.loesung) > Math.max(f.tol === undefined ? 0.005 : f.tol, x.tol)); });
    return t;
  }

  function parseNum(raw) {
    let s = String(raw).replace(/\s/g, "").replace(/[−–]/g, "-").replace(/[^0-9,.\-]/g, "");
    if (!s || !/\d/.test(s)) return NaN;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    if ((s.match(/\./g) || []).length > 1 || (s.match(/-/g) || []).length > 1 || (s.includes("-") && s[0] !== "-")) return NaN;
    const n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  /* ---------- Checkliste: was in der Probe drankommt ----------
     Jeder Punkt holt sich eine mittelschwere Aufgabe genau dieses Typs aus den Stationen.
     Der Typ wird nicht erzwungen, sondern neu gewürfelt, bis er passt. So bleibt der
     geprüfte Zahlenvorrat unverändert. Keine Aufgabennummern, keine Punkte der Probe. */
  const rueck = t => / rückwärts$/.test(t.titel);
  const CHECKLISTE = [
    { thema: "Umwandeln", station: "verwandler", punkte: [
      { id: "umw", text: "Ich kann Prozent in Bruch, Hundertstelbruch und Dezimalbruch umwandeln und den Bruch kürzen.", stufe: 2, passt: t => t.probe.typ === "gesicht" }
    ] },
    { thema: "Grundaufgaben", station: "detektei", punkte: [
      { id: "pw", text: "Ich kann den Prozentwert berechnen.", stufe: 2, passt: t => t.probe.typ === "grund" && t.probe.art === "s" },
      { id: "gw", text: "Ich kann den Grundwert berechnen.", stufe: 2, passt: t => t.probe.typ === "grund" && t.probe.art === "u" },
      { id: "ps", text: "Ich kann den Prozentsatz berechnen.", stufe: 2, passt: t => t.probe.typ === "grund" && t.probe.art === "q" }
    ] },
    { thema: "Kreisdiagramm", station: "kreis", punkte: [
      { id: "kreis", text: "Ich kann Anzahlen in Prozent und Winkel umrechnen und das Kreisdiagramm zeichnen.", stufe: 2, opt: { modus: "ziehen" }, passt: t => t.probe.typ === "kreis" }
    ] },
    { thema: "Preissteigerung und Preissenkung", station: "preis", punkte: [
      { id: "faktor", text: "Ich kann einen neuen Wert mit dem Wachstumsfaktor berechnen, wenn er steigt oder sinkt.", stufe: 2, passt: t => t.probe.typ === "preis" && !rueck(t) && t.zahlen.length === 3 },
      { id: "aenderung", text: "Ich kann berechnen, um wie viel Prozent sich ein Wert verändert hat.", stufe: 2, passt: t => t.probe.typ === "preis" && !rueck(t) && t.zahlen.length === 2 },
      { id: "vorher", text: "Ich kann rückwärts rechnen: Wie groß war der Wert vorher?", stufe: 2, passt: t => t.probe.typ === "preis" && rueck(t) }
    ] },
    { thema: "Nettopreis und Bruttopreis", station: "bon", punkte: [
      { id: "bon", text: "Ich kann Rabatt, Umsatzsteuer und Skonto nacheinander berechnen. Jede Zeile hat einen neuen Grundwert.", stufe: 2, passt: t => t.probe.typ === "bon" && !t.probe.gefragt },
      { id: "gesamt", text: "Ich kann sagen, um wie viel Prozent der Endbetrag insgesamt vom Anfangspreis abweicht.", stufe: 2, passt: t => t.probe.typ === "bon" && t.probe.gefragt }
    ] },
    { thema: "Verkaufspreis kalkulieren", station: "kalk", punkte: [
      { id: "vkp", text: "Ich kann vom Einkaufspreis über Handlungskosten, Selbstkosten, Gewinn und Umsatzsteuer den Verkaufspreis berechnen.", stufe: 2, passt: t => t.probe.typ === "kalk" && t.probe.art === "vor" },
      { id: "vkpfaktor", text: "Ich kann den Verkaufspreis mit Operatoren (Faktoren) in einer Rechnung berechnen.", stufe: 2, passt: t => t.probe.typ === "kalk" && t.probe.art === "faktor" },
      { id: "vkprueck", text: "Ich kann vom Verkaufspreis rückwärts bis zum Einkaufspreis rechnen.", stufe: 2, passt: t => t.probe.typ === "kalk" && t.probe.art === "rueck" }
    ] },
    { thema: "Brutto, Netto, Tara (Gewicht)", station: "lager", punkte: [
      { id: "tara", text: "Ich kann aus dem Brutto die Tara und das Netto berechnen.", stufe: 2, passt: t => t.probe.typ === "tara" && t.teile[0].label === "Tara" },
      { id: "brutto", text: "Ich kann rückwärts das Brutto berechnen, wenn Netto oder Tara gegeben ist.", stufe: 2, passt: t => t.probe.typ === "tara" && t.teile[0].label === "Brutto" }
    ] },
    { thema: "Promille", station: "promille", punkte: [
      { id: "pmsatz", text: "Ich kann einen Anteil in Promille berechnen und prüfen, ob eine Grenze erreicht ist.", stufe: 2, passt: t => t.probe.typ === "satz" },
      { id: "pmwert", text: "Ich kann eine Menge aus einem Promillewert berechnen, zum Beispiel eine Grenzmenge.", stufe: 2, passt: t => t.probe.typ === "wert" },
      { id: "warum", text: "Ich kann erklären, warum der Anteil größer wird, wenn der Grundwert kleiner ist.", stufe: 2, opt: { ohneZeichnen: true }, passt: t => t.probe.typ === "salz" }
    ] }
  ];
  const PUNKTE = CHECKLISTE.flatMap(g => g.punkte.map(p => Object.assign({ thema: g.thema, station: g.station }, p)));

  function erzeugePunkt(punktId, r) {

        <div class="knoepfe"><button class="knopf" id="startcheck">${S.check ? "Start-Check wiederholen" : "Start-Check machen"}</button><button class="knopf gelb" id="generalprobe">Generalprobe (14 Minuten)</button></div></section>
    </div>
    <div class="tagkopf"><h2>Tag 1</h2><span class="klein">Wähle deine Reihenfolge. Fang dort an, wo die Ampel rot ist.</span></div>
    <div class="raster">${STATIONEN.filter(s => s.tag === 1).map((s, i) => kachel(s, i, true)).join("")}</div>
    <div class="tagkopf"><h2>Tag 2</h2><span class="klein">Geodreieck und Heft bereitlegen.</span></div>
