  }

  function passSeite() {
    const karten = STATIONEN.map(s => { const st = S.st[s.id]; return `<div class="passkarte ${st.abzeichen ? "" : "leer"}">${BILD[s.id]}<div><b>${s.name}</b><br><span class="klein">${st.abzeichen ? "Abzeichen geschafft" : `${st.richtig} richtig, ${st.fehl} noch nicht`}</span></div></div>`; }).join("");
    const offen = STATIONEN.filter(s => !S.st[s.id].abzeichen);
    const gp = S.generalprobe ? `<p>Generalprobe: <b>${S.generalprobe.richtig} von ${S.generalprobe.gesamt}</b> auf Anhieb richtig.</p>` : "";
    return `<section class="kachel"><h1 class="schrift" style="font-size:32px;color:var(--blau-tief)">Mein Fitnesspass</h1><p class="klein">Bleibt nur auf diesem Gerät gespeichert. Es wird nichts verschickt.</p>${gp}
      <div class="passraster">${karten}</div>
      <h2 style="margin-top:20px;font-size:23px;color:var(--blau-tief)">Mein Merkzettel fürs Heft</h2>
      <ul class="liste"><li>${offen.length ? `Das übe ich noch: <b>${offen.map(s => s.name).join(", ")}</b>.` : "Alle Stationen geschafft. Rechne zu Hause noch einmal die Stufe 3."}</li>
      <li>Schreib dir je Station eine Beispielaufgabe mit Rechenweg ins Heft.</li><li>Notiere deinen häufigsten Fehler und wie du ihn beim nächsten Mal vermeidest.</li></ul>
      <div class="knoepfe"><button class="knopf" id="drucken">Als PDF für OneNote sichern</button><button class="knopf zwei" id="zuruecksetzen">Pass zurücksetzen</button></div></section>`;
  }
  function zuruecksetzen() {
    const b = $("#zuruecksetzen");
    if (b.dataset.sicher) { const l = leererStand(); S.st = l.st; S.check = null; S.generalprobe = null; S.liste = {}; speichern(); gehe({ art: "pass" }); return; }
    b.dataset.sicher = "1"; b.textContent = "Wirklich alles löschen?";
  }

  function lehrSeite() {
    return `<div class="spalten2"><section class="kachel"><h1 class="schrift" style="font-size:30px;color:var(--blau-tief)">Ablauf</h1>
      <table class="plan"><tr><th></th><th>Tag 1</th><th>Tag 2</th></tr>
      <tr><th>5 Min</th><td>Start-Check: 8 Fragen, je Station eine. Ergibt die Ampel.</td><td>Ampel ansehen, Tagesziel wählen.</td></tr>
      <tr><th>30 bis 35 Min</th><td>Preis-Maschine, Verwandler, Kassenbon, Detektei</td><td>Promille-Labor, Lager, Kreis-Studio (Geodreieck, Heft). Etwa 25 Min.</td></tr>
      <tr><th>Rest</th><td>Stolperstelle des Tages an die Tafel</td><td>14 Min Generalprobe, 3 Min Merkzettel</td></tr></table>
      <h2 style="margin-top:14px;font-size:22px;color:var(--blau-tief)">Regeln</h2>
      <ul class="liste"><li>Gerechnet wird im Heft. Der Rechenweg bleibt sichtbar. Bitte stichprobenartig ansehen, die Seite prüft nur Ergebnisse.</li><li>Im Kreis-Studio wird die erste Aufgabe auf Stufe 2 immer mit dem Geodreieck gezeichnet.</li><li>Abzeichen: 3 Aufgaben in Folge auf Stufe 2, ohne Lösungsweg und höchstens mit einer Korrektur.</li><li>Wer fertig ist, geht auf Stufe 3.</li><li>Reiter Checkliste: 18 Kann-Punkte aus der Probe. Zu jedem Punkt gibt es eine mittelschwere Testaufgabe, richtig gelöst wird abgehakt. Die Checklisten-Generalprobe fragt alle Punkte nacheinander ab, ohne Zeitlimit.</li><li>Keine Namen, kein Server, Fortschritt nur auf dem Gerät.</li></ul>
      <h2 style="margin-top:14px;font-size:22px;color:var(--blau-tief)">Lehrplan</h2>
      <p>LehrplanPLUS Mittelschule, Mathematik 8, Mittlere-Reife-Klasse, Lernbereich 1 Prozentrechnung: Wachstumsfaktor, Rabatt, Skonto, Umsatzsteuer, Brutto, Netto, Tara, Kreisdiagramm, Promille. Station Kalkulation (Buch S. 22/23): Einkaufspreis, Handlungskosten, Selbstkosten, Gewinn oder Verlust, Umsatzsteuer, vorwärts und rückwärts. Seit 10.11. Teil der Probe, deshalb auch im Start-Check, in der Generalprobe und in der Checkliste.</p></section>
      <section class="kachel"><h2 style="font-size:24px;color:var(--blau-tief)">QR für die Klasse</h2><img class="qr" src="qr.png" alt="QR-Code zur Seite"><p class="klein">fhe86.github.io/prozent-training</p>
      <h2 style="margin-top:14px;font-size:22px;color:var(--blau-tief)">Für OneNote und als Reserve</h2>
      <ul class="liste"><li><a href="material/fitnesspass.pdf">Fitnesspass als PDF</a></li><li><a href="material/reserve-aufgaben.pdf">Reserve-Aufgaben mit Lösungen</a>, falls das WLAN ausfällt</li><li><a href="material/kreise-zeichnen.pdf">Kreise zeichnen</a>: zwei Umfragen zum Zeichnen mit Pencil oder Geodreieck, mit Lösung</li></ul></section></div>`;
  }

  /* ---------- Station ---------- */
  let aktuell = null;
  /* Bis einmal mit dem Geodreieck gezeichnet wurde, kommt die Heft-Variante. */
  const naechste = (id, st) => erzeuge(id, st.stufe, Math.random, id === "kreis" && !st.heft ? { modus: "heft" } : {});
  function stationOeffnen(id, stufe) {
    const st = S.st[id];
    if (stufe) st.stufe = stufe;
    aktuell = neuerZustand(naechste(id, st));
    ansicht = { art: "station", id };
    zeichnen(); window.scrollTo(0, 0);
  }
  function neuerZustand(t) { return { t, wahl: {}, werte: {}, versuche: 0, offen: 0, fertig: false, wegOffen: false, gemeldet: {}, kreis: {} }; }

  function stationZeichnen() {
    const s = station(ansicht.id), st = S.st[s.id];
    const inh = $("#inhalt");
    const stufen = [[1, "Stufe 1 geführt"], [2, "Stufe 2 selbstständig"], [3, "Stufe 3 knifflig"]];
    const serie = [0, 1, 2].map(i => `<span class="punkt ${i < st.serie ? "an" : ""}"></span>`).join("");
    inh.innerHTML = `<button class="zurueck" data-go="start">Alle Stationen</button>
      <div class="station-kopf">${BILD[s.id]}<div><h1>${s.name}</h1><span class="klein">${s.motto}</span></div></div>
      <div class="leiste"><div class="stufen" role="group" aria-label="Stufe">${stufen.map(([n, l]) => `<button data-stufe="${n}" aria-pressed="${st.stufe === n}">${l}</button>`).join("")}</div>
      <div class="serie">${st.abzeichen ? ABZEICHEN().replace('class="abzeichen"', 'width="32" height="32"') + " Abzeichen geschafft" : `${serie} 3 in Folge auf Stufe 2`}<button class="textlink" id="hilfe">Hilfekarte</button></div></div>
      <div id="aufgabe"></div>`;
    inh.querySelector("[data-go]").addEventListener("click", () => gehe({ art: "start" }));
    inh.querySelectorAll("[data-stufe]").forEach(b => b.addEventListener("click", () => stationOeffnen(s.id, Number(b.dataset.stufe))));
    $("#hilfe").addEventListener("click", () => hilfeOeffnen(s));
    aufgabeZeichnen($("#aufgabe"), aktuell, {
      bewerten: (z, ok) => {
        if (ok) { st.richtig++; if (s.id === "kreis" && z.t.teile.some(x => x.art === "selbst")) st.heft = true; }
        if (z.t.stufe === 2 && !st.abzeichen) {
          if (ok && !z.wegGenutzt && z.versuche <= 2) st.serie = Math.min(3, st.serie + 1); else if (ok) st.serie = 0;
          if (st.serie >= 3) { st.abzeichen = true; speichern(); feier(s); }
        }
        speichern();
        stationZeichnen();
      },
      fehl: () => { st.fehl++; speichern(); },
      weiter: () => { if (!aktuell.fertig && aktuell.t.stufe === 2) { st.serie = 0; speichern(); } aktuell = neuerZustand(naechste(s.id, st)); stationZeichnen(); window.scrollTo(0, 0); },
      wegNutzen: () => { if (aktuell.t.stufe === 2 && !aktuell.fertig) { st.serie = 0; speichern(); } }
    });
  }
  function hilfeOeffnen(s) {
    const d = document.createElement("div"); d.className = "schleier";
    d.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Hilfekarte: ${s.name}</h2>${HILFE[s.id]}<div class="aktionen"><button class="knopf" id="zu">Verstanden</button></div></div>`;
    document.body.appendChild(d);
    const zu = () => d.remove();
    d.addEventListener("click", e => { if (e.target === d) zu(); }); $("#zu", d).addEventListener("click", zu);
  }
  function feier(s) {
    const d = document.createElement("div"); d.className = "feier";
    d.innerHTML = `<div><div style="width:170px;margin:0 auto">${COACH("hupf")}</div>${ABZEICHEN().replace('class="abzeichen"', 'width="90" height="90"')}<h2>Abzeichen: ${s.name}!</h2><p>Drei richtig in Folge. Weiter auf Stufe 3 oder zur nächsten Station.</p><div class="aktionen" style="justify-content:center"><button class="knopf">Weiter</button></div></div>`;
    document.body.appendChild(d); $("button", d).addEventListener("click", () => d.remove());
  }

  /* ---------- Aufgabe zeichnen und prüfen ---------- */
  function aufgabeZeichnen(ziel, z, cb, opt) {
    opt = opt || {};
    const t = z.t;
    const sichtbar = t.nacheinander && !z.fertig ? z.offen + 1 : t.teile.length;
    const breit = t.spiel;
    const teile = t.teile.slice(0, sichtbar).map((x, i) => teilHtml(x, i, z, t)).join("");
    const heft = t.spiel ? "" : `<div class="heft-hinweis"><b>Heft:</b> Rechne dort mit Rechenweg. Hier nur das Ergebnis.</div>`;
    ziel.innerHTML = `<div class="arbeit ${breit ? "breit" : ""}">
      <section class="kachel szene"><h2>${t.titel}</h2><p>${t.text}</p>${bonFuellen(szeneHtml(t.szene), z)}</section>
      <section class="kachel">${heft}<div id="teile">${teile}</div>
        <div id="rueck">${z.rueck || ""}</div>
        <div class="aktionen">${z.fertig || t.spiel ? "" : `<button class="knopf" id="pruefen">Prüfen</button>`}
          <button class="knopf ${z.fertig ? "" : "zwei"}" id="neu">${opt.weiterText || "Noch eine"}</button>
          ${opt.ohneWeg ? "" : `<button class="textlink" id="wegzeigen">${z.wegOffen ? "Lösungsweg verbergen" : "Lösungsweg zeigen"}</button>`}</div>
        ${z.wegOffen ? `<div class="weg"><b>So geht es:</b><ol>${t.weg.map(w => `<li>${w}</li>`).join("")}</ol></div>` : ""}</section></div>`;
    verbinden(ziel, z, cb, opt);
  }

  function bonFuellen(html, z) {
    if (!z.t.szene || z.t.szene.typ !== "bon") return html;
    const zeilen = z.t.teile.filter(x => x.art === "zahl" && x.id !== "g" && z.gemeldet[x.id] && z.gemeldet[x.id].ok)
      .map(x => `<div class="zz"><span>${x.label}</span><b>${zahl(x.loesung, 2)}\u00a0€</b></div>`).join("");
    return html.replace('<p style="text-align:center;font-size:13px;margin-top:8px">Die Zeilen füllst du rechts aus.</p>', zeilen || '<p style="text-align:center;font-size:13px;margin-top:8px">Richtige Zeilen erscheinen hier.</p>');
  }

  function teilHtml(x, i, z, t) {
    const zust = z.gemeldet[x.id] || {};
    const kl = zust.ok === true ? "richtig" : zust.ok === false ? "falsch" : "";
    const ms = zust.msg ? `<div class="meldung ${zust.ok === true ? "gut" : ""}">${zust.msg}</div>` : "";
    const fest = zust.ok === true || z.fertig ? "disabled" : "";
    const hilfe = x.hilfe ? `<div class="hilfe">${x.hilfe}</div>` : "";
    if (x.art === "zahl") {
      if (t.layout === "bon") return `<div class="teil ${kl}"><div class="bon-zeile"><label for="f-${x.id}">${x.label}</label><div class="eingabe"><input id="f-${x.id}" data-id="${x.id}" inputmode="decimal" autocomplete="off" value="${esc(z.werte[x.id] || "")}" ${fest}><span>${x.einheit}</span></div></div>${hilfe}${ms}</div>`;
      return `<div class="teil ${kl}"><label for="f-${x.id}">${x.label}</label>${hilfe}<div class="eingabe"><input id="f-${x.id}" data-id="${x.id}" inputmode="decimal" autocomplete="off" value="${esc(z.werte[x.id] || "")}" ${fest}><span>${x.einheit}</span>${zust.ok === true ? '<span class="ok-haken">richtig</span>' : ""}</div>${ms}</div>`;
    }
    if (x.art === "wahl") {
      const kurz = x.optionen.every(o => o.length < 16);
      return `<div class="teil"><div class="frage">${x.label}</div><div class="optionen ${kurz ? "nebeneinander" : ""}" role="group">${x.optionen.map((o, j) => {
        let c = ""; if (zust.ok !== undefined && z.wahl[x.id] === j) c = zust.ok ? "richtig" : "falsch";
        return `<button class="option ${c}" data-wahl="${x.id}" data-j="${j}" aria-pressed="${z.wahl[x.id] === j}" ${fest}>${o}</button>`;
      }).join("")}</div>${ms}</div>`;
    }
    if (x.art === "bruch") return `<div class="teil ${kl}"><div class="frage">${x.label}</div><div class="bruch-eingabe eingabe"><input aria-label="Zähler" data-id="${x.id}-z" inputmode="numeric" autocomplete="off" value="${esc(z.werte[x.id + "-z"] || "")}" ${fest}><hr><input aria-label="Nenner" data-id="${x.id}-n" inputmode="numeric" autocomplete="off" value="${esc(z.werte[x.id + "-n"] || "")}" ${fest}></div>${ms}</div>`;
    if (x.art === "vierling") return memoryHtml(x, z);
    if (x.art === "kreis") return `<div class="teil"><div class="frage">${x.label}</div><div class="hilfe">Beginne oben und zieh im Uhrzeigersinn. Reihenfolge wie in der Tabelle. Mit dem Griff grob, mit den Knöpfen genau.</div><div id="kreisbox"></div>${ms}</div>`;
    if (x.art === "selbst") {
      const zeigt = z.kreis.vergleich;
      const muster = !zeigt ? "" : x.winkel ? `<div class="bildflaeche" style="max-width:240px">${kreisSvg(x.winkel, x.namen)}</div>` : `<div class="weg"><b>Musterantwort:</b> ${x.muster}</div>`;
      return `<div class="teil"><div class="frage">${x.label}</div>${muster}<div class="aktionen"><button class="option" id="vergleich" ${zeigt ? "disabled" : ""}>Muster zum Vergleichen zeigen</button>${zeigt ? `<button class="option ${z.wahl[x.id] === 1 ? "richtig" : ""}" id="abhaken" aria-pressed="${z.wahl[x.id] === 1}">${x.knopf}</button>` : ""}</div>${ms}</div>`;
    }
    return "";
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* Memory */
  function memoryHtml(x, z) {
    if (!z.karten) { const k = []; x.sets.forEach((s, i) => s.karten.forEach((c, j) => k.push({ c, set: i, id: `${i}-${j}` }))); z.karten = mischen(Math.random, k); z.gewaehlt = []; z.geloest = []; }
    const inh = c => c.art === "bruch" ? `<span class="b"><i>${c.z}</i><i>${c.n}</i></span>` : c.t;
    return `<div class="memory">${z.karten.map(k => `<button class="mkarte ${z.geloest.includes(k.set) ? "fertig" : ""}" data-karte="${k.id}" aria-pressed="${z.gewaehlt.includes(k.id)}">${inh(k.c)}</button>`).join("")}</div>`;
  }

  /* Kreis zum Ziehen */
  function kreisZiehen(box, x, z, nachFertig) {
    if (!z.kreis.gesetzt) z.kreis.gesetzt = [];
    if (z.kreis.lauf === undefined) z.kreis.lauf = 30;
    const cx = 130, cy = 130, r = 112, F = ["#bcd3f7", "#ffd24d", "#ff9d90", "#a9e0c4", "#d9c8f5"], g = Math.PI / 180;
    const fertig = z.kreis.gesetzt.length >= x.winkel.length;
    const sum = a => a.reduce((s, v) => s + v, 0);
    const start = sum(z.kreis.gesetzt);
    function bogen(von, w, f) {
      if (w <= 0) return "";
      if (w >= 359.9) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="#14233d" stroke-width="2"/>`;
      const a = von - 90, b = a + w;
      return `<path d="M${cx} ${cy}L${(cx + r * Math.cos(a * g)).toFixed(2)} ${(cy + r * Math.sin(a * g)).toFixed(2)}A${r} ${r} 0 ${w > 180 ? 1 : 0} 1 ${(cx + r * Math.cos(b * g)).toFixed(2)} ${(cy + r * Math.sin(b * g)).toFixed(2)}Z" fill="${f}" stroke="#14233d" stroke-width="2"/>`;
    }
    function male() {
      let s = "", a = 0;
      z.kreis.gesetzt.forEach((w, i) => { s += bogen(a, w, F[i % 5]); const m = (a + w / 2 - 90) * g; s += `<text x="${(cx + r * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + r * .62 * Math.sin(m) + 4).toFixed(1)}" text-anchor="middle" font-size="${w < 40 ? 10 : 13}" font-weight="700">${x.namen[i]}</text>`; a += w; });
      const i = z.kreis.gesetzt.length;
      let griff = "";
      if (i < x.winkel.length) {
        s += bogen(a, z.kreis.lauf, F[i % 5]);
        const e = (a + z.kreis.lauf - 90) * g;
        griff = `<circle class="griff" cx="${(cx + r * Math.cos(e)).toFixed(2)}" cy="${(cy + r * Math.sin(e)).toFixed(2)}" r="15" fill="#ff6f5e" stroke="#14233d" stroke-width="3"/>`;
      }
      return `<svg id="kreisflaeche" viewBox="0 0 260 260" aria-label="Kreis zum Ziehen"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#14233d" stroke-width="2"/>${s}<path d="M${cx} ${cy}V${cy - r}" stroke="#14233d" stroke-width="3"/>${griff}</svg>`;
    }
    function zeichne() {
      const i = z.kreis.gesetzt.length, ende = i >= x.winkel.length;
      box.innerHTML = `<div class="kreisfeld">${male()}<div class="kreissteuer">${ende ? `<b>Alle Sektoren gesetzt.</b><div class="aktionen"><button class="textlink" id="kneu">Neu zeichnen</button></div>` : `<div class="klein">Sektor ${i + 1} von ${x.winkel.length}: <b>${x.namen[i]}</b></div><div class="kreiswert">${z.kreis.lauf}°</div><div class="feinknopf"><button id="kminus" aria-label="1 Grad weniger">−1°</button><button id="kplus" aria-label="1 Grad mehr">+1°</button></div><button class="knopf zwei" id="kset">Sektor setzen</button>`}</div></div>`;
      const fl = $("#kreisflaeche", box);
      if (!ende) {
        const max = 360 - sum(z.kreis.gesetzt);
        const setze = v => { z.kreis.lauf = Math.max(1, Math.min(max, v)); zeichne(); };
        const zieh = e => {
          const b = fl.getBoundingClientRect();
          const px = (e.clientX - b.left) / b.width * 260, py = (e.clientY - b.top) / b.height * 260;
          let w = Math.atan2(py - cy, px - cx) / g + 90; if (w < 0) w += 360;
          let d = w - sum(z.kreis.gesetzt); if (d <= 0) d += 360;
          z.kreis.lauf = Math.max(1, Math.min(max, Math.round(d)));
          const neu = male(); const tmp = document.createElement("div"); tmp.innerHTML = neu;
          fl.innerHTML = tmp.firstChild.innerHTML;
          $(".kreiswert", box).textContent = z.kreis.lauf + "°";
        };
        let aktiv = false;
        fl.addEventListener("pointerdown", e => { aktiv = true; try { fl.setPointerCapture(e.pointerId); } catch (x) {} zieh(e); e.preventDefault(); });
        fl.addEventListener("pointermove", e => { if (aktiv) { zieh(e); e.preventDefault(); } });
        fl.addEventListener("pointerup", () => { aktiv = false; });
        fl.addEventListener("pointercancel", () => { aktiv = false; });
        $("#kminus", box).addEventListener("click", () => setze(z.kreis.lauf - 1));
        $("#kplus", box).addEventListener("click", () => setze(z.kreis.lauf + 1));
        $("#kset", box).addEventListener("click", () => { z.kreis.gesetzt.push(z.kreis.lauf); z.kreis.lauf = Math.min(30, 360 - sum(z.kreis.gesetzt)) || 1; zeichne(); nachFertig(); });
      } else {
        $("#kneu", box).addEventListener("click", () => { z.kreis.gesetzt = []; z.kreis.lauf = 30; zeichne(); });
      }
    }
    zeichne();
  }

  function verbinden(ziel, z, cb, opt) {
    const t = z.t, neuz = () => aufgabeZeichnen(ziel, z, cb, opt);
    ziel.querySelectorAll("input[data-id]").forEach(i => {
      i.addEventListener("input", () => { z.werte[i.dataset.id] = i.value; });
      i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const p = $("#pruefen", ziel); if (p) p.click(); } });
    });
    ziel.querySelectorAll("[data-wahl]").forEach(b => b.addEventListener("click", () => {
      merke(ziel, z); z.wahl[b.dataset.wahl] = Number(b.dataset.j); delete z.gemeldet[b.dataset.wahl]; neuz();
    }));
    const kb = $("#kreisbox", ziel);
    if (kb) { const x = t.teile.find(y => y.art === "kreis"); kreisZiehen(kb, x, z, () => {}); }
    const vg = $("#vergleich", ziel);
    if (vg) vg.addEventListener("click", () => { merke(ziel, z); z.kreis.vergleich = true; neuz(); });
    const ab = $("#abhaken", ziel);
    if (ab) ab.addEventListener("click", () => { merke(ziel, z); const x = t.teile.find(y => y.art === "selbst"); z.wahl[x.id] = z.wahl[x.id] === 1 ? undefined : 1; neuz(); });
    ziel.querySelectorAll("[data-karte]").forEach(b => b.addEventListener("click", () => memoryTipp(ziel, z, cb, opt, b)));
    const pr = $("#pruefen", ziel);
    if (pr) pr.addEventListener("click", () => { merke(ziel, z); pruefen(ziel, z, cb, opt); });
    $("#neu", ziel).addEventListener("click", () => cb.weiter());
    const wz = $("#wegzeigen", ziel);
    if (wz) wz.addEventListener("click", () => { merke(ziel, z); z.wegOffen = !z.wegOffen; if (z.wegOffen) { z.wegGenutzt = true; if (cb.wegNutzen) cb.wegNutzen(); } neuz(); });
  }
  function merke(ziel, z) { ziel.querySelectorAll("input[data-id]").forEach(i => { z.werte[i.dataset.id] = i.value; }); }

  function memoryTipp(ziel, z, cb, opt, b) {
    const x = z.t.teile[0], id = b.dataset.karte;
    if (z.gewaehlt.includes(id)) z.gewaehlt = z.gewaehlt.filter(k => k !== id); else z.gewaehlt.push(id);
    if (z.gewaehlt.length === 4) {
      const set = z.gewaehlt.map(k => Number(k.split("-")[0]));
      if (set.every(v => v === set[0])) {
        z.geloest.push(set[0]); z.gewaehlt = [];
        if (z.geloest.length === x.sets.length) { z.fertig = true; z.versuche = Math.max(1, z.fehlgriffe > 1 ? 3 : 1); z.rueck = coachZeile(true, "Alle Vierlinge gefunden!"); cb.bewerten(z, true); return; }
      } else {
        z.fehlgriffe = (z.fehlgriffe || 0) + 1; z.gewaehlt = [];
        z.rueck = coachZeile(false, "Diese vier haben nicht denselben Wert. Rechne alles in Prozent um und vergleiche.");
        if (cb.fehl) cb.fehl();
      }
    }
    aufgabeZeichnen(ziel, z, cb, opt);
  }

  function coachZeile(gut, text) { return `<div class="coachzeile ${gut ? "gut" : "nochmal"}">${COACH(gut ? "hupf" : "wackel")}<div>${text}</div></div>`; }
  const LOB = ["Sauber gerechnet!", "Genau so!", "Stark, das sitzt.", "Richtig. Weiter so!", "Treffer!"];

  /* Prüft die sichtbaren Teile. Fehlermeldungen greifen erst, wenn die Antwort nicht stimmt. */
  function teilPruefen(x, z) {
    if (x.art === "zahl") {
      const roh = z.werte[x.id];
      if (roh === undefined || String(roh).trim() === "") return { ok: false, leer: true, msg: "Hier fehlt noch dein Ergebnis." };
      const n = parseNum(roh);
      if (Number.isNaN(n)) return { ok: false, msg: "Das kann ich nicht lesen. Tippe nur die Zahl, zum Beispiel 12,5." };
      if (Math.abs(n - x.loesung) <= x.tol || (x.egal && Math.abs(Math.abs(n) - x.loesung) <= x.tol)) return { ok: true };
      for (const f of x.fehler) if (Math.abs(n - f.wert) <= (f.tol === undefined ? 0.005 : f.tol)) return { ok: false, msg: f.msg };
      if (Math.abs(n) === Math.abs(x.loesung)) return { ok: false, msg: "Die Zahl stimmt, aber achte auf das Vorzeichen." };
      if (Math.abs(n - x.loesung) <= Math.max(0.5, Math.abs(x.loesung) * 0.01)) return { ok: false, msg: "Fast. Prüfe die letzten Stellen und die Rundung." };
      return { ok: false, msg: "Das stimmt noch nicht. Prüfe deinen Ansatz." };
    }
    if (x.art === "wahl") {
      const w = z.wahl[x.id];
      if (w === undefined) return { ok: false, leer: true, msg: "Wähle noch eine Antwort." };
      if (w === x.richtig) return { ok: true };
      return { ok: false, msg: x.fehler[w] || "Das passt noch nicht. Überlege noch einmal." };
    }
    if (x.art === "bruch") {
      const a = parseNum(z.werte[x.id + "-z"]), b = parseNum(z.werte[x.id + "-n"]);
      if (Number.isNaN(a) || Number.isNaN(b)) return { ok: false, leer: true, msg: "Fülle Zähler und Nenner aus." };
      if (b === 0) return { ok: false, msg: "Durch 0 kann man nicht teilen. Prüfe den Nenner." };
      if (a === x.z && b === x.n) return { ok: true };
      /* Jeder gleichwertige Bruch zählt. Ist er noch nicht ganz gekürzt, zeigt der Coach die gekürzte Form. */
      if (Number.isInteger(a) && Number.isInteger(b) && a * x.n === b * x.z) return { ok: true, msg: `Richtig. Ganz gekürzt heißt der Bruch ${x.z}/${x.n}.` };
      return { ok: false, msg: "Der Bruch hat einen anderen Wert. Erweitere zuerst auf Hundertstel." };
    }
    if (x.art === "kreis") {
      const g = z.kreis.gesetzt || [];
      if (g.length < x.winkel.length) return { ok: false, msg: "Setze zuerst alle Sektoren." };
      const falsch = x.winkel.findIndex((w, i) => Math.abs(g[i] - w) > 2);
      if (falsch < 0) return { ok: true };
      return { ok: false, msg: `Sektor ${x.namen[falsch]} ist nicht auf 2° genau. Tippe auf Neu zeichnen.` };
    }
    if (x.art === "selbst") {
      if (z.wahl[x.id] === 1) return { ok: true };
      return { ok: false, leer: true, msg: "Arbeite im Heft, zeig das Muster und hake ab, wenn es passt." };
    }
    return { ok: true };
  }

  function pruefen(ziel, z, cb, opt) {
    const t = z.t;
    const sichtbar = t.nacheinander ? t.teile.slice(0, z.offen + 1) : t.teile;
    let allesOk = true;
    let leer = false;
    sichtbar.forEach(x => { const e = teilPruefen(x, z); z.gemeldet[x.id] = e; if (!e.ok) allesOk = false; if (e.leer) leer = true; });
    if (leer && opt.einVersuch) { z.rueck = coachZeile(false, "Fülle erst alle Felder aus."); aufgabeZeichnen(ziel, z, cb, opt); return; }
    z.versuche++;
    const voll = allesOk && sichtbar.length === t.teile.length;
    if (allesOk && !voll) { z.offen++; z.rueck = ""; aufgabeZeichnen(ziel, z, cb, opt); const n = ziel.querySelector("#teile input:not([disabled])"); if (n) n.focus(); return; }
    if (voll) {
      z.fertig = true;
      z.rueck = coachZeile(true, LOB[Math.floor(Math.random() * LOB.length)]);
      cb.bewerten(z, true);
      return;
    }
    if (opt.einVersuch) { z.fertig = true; z.wegOffen = true; z.rueck = coachZeile(false, "Noch nicht ganz. So wäre es gegangen:"); cb.bewerten(z, false); return; }
    z.rueck = coachZeile(false, "Noch nicht ganz. Die roten Felder darfst du verbessern.");
    if (cb.fehl) cb.fehl();
    aufgabeZeichnen(ziel, z, cb, opt);
  }

  /* ---------- Start-Check und Generalprobe ---------- */
  let lauf = null;
  function checkStarten() {
    const reihe = mischen(Math.random, STATIONEN.filter(s => !s.extra).map(s => s.id));
    lauf = { art: "check", reihe, i: 0, ergebnis: {}, z: neuerZustand(erzeuge(reihe[0], 2, Math.random, { ohneZeichnen: true })), bewertet: false };
    ansicht = { art: "lauf" }; zeichnen();
  }
  function generalprobeStarten() {
    const reihe = mischen(Math.random, STATIONEN.filter(s => !s.extra).map(s => s.id));
    lauf = { art: "gp", reihe, i: 0, ergebnis: {}, ende: Date.now() + 14 * 60000, z: neuerZustand(erzeuge(reihe[0], 2, Math.random, { ohneZeichnen: true })), bewertet: false };
    ansicht = { art: "lauf" }; zeichnen();
  }
  let uhrId = null;
  function laufZeichnen() {
    const inh = $("#inhalt"), L = lauf, name = L.art === "check" ? "Start-Check" : "Generalprobe";
    clearInterval(uhrId);
    if (L.i >= L.reihe.length || (L.ende && Date.now() >= L.ende)) return laufEnde();
    inh.innerHTML = `<button class="zurueck" id="lauf-ab">Abbrechen</button><div class="leiste"><h1 class="schrift" style="font-size:30px;color:var(--blau-tief)">${name}</h1>${L.ende ? `<div class="uhr" id="uhr"></div>` : ""}</div>
      <div class="klein">Aufgabe ${L.i + 1} von ${L.reihe.length}${L.art === "gp" ? ". Keine Note. Ein Versuch pro Aufgabe." : ". Eine Frage je Station. Weiß du es nicht, überspring sie."}</div><div class="fortschritt"><i style="width:${L.i / L.reihe.length * 100}%"></i></div><div id="aufgabe"></div>`;
    $("#lauf-ab").addEventListener("click", () => { clearInterval(uhrId); gehe({ art: "start" }); });
    if (L.ende) { const uhr = () => { const r = Math.max(0, L.ende - Date.now()), m = Math.floor(r / 60000), s = Math.floor(r / 1000) % 60, u = $("#uhr"); if (u) u.textContent = `${m}:${String(s).padStart(2, "0")}`; if (r <= 0) { clearInterval(uhrId); laufEnde(); } }; uhr(); uhrId = setInterval(uhr, 1000); }
    const zeichneLauf = () => aufgabeZeichnen($("#aufgabe"), L.z, {
      bewerten: (z, ok) => { L.ergebnis[z.t.station] = ok ? "gruen" : "gelb"; zeichneLauf(); },
      fehl: () => {},
      weiter: () => { if (!L.ergebnis[L.z.t.station]) L.ergebnis[L.z.t.station] = "rot"; laufNaechste(); }
    }, { ohneWeg: true, einVersuch: true, weiterText: L.z.fertig ? "Weiter" : "Überspringen" });
    zeichneLauf();
  }
  function laufNaechste() {
    const L = lauf; L.i++;
    if (L.i < L.reihe.length) L.z = neuerZustand(erzeuge(L.reihe[L.i], 2, Math.random, { ohneZeichnen: true }));
    laufZeichnen(); window.scrollTo(0, 0);
  }
  function laufEnde() {
    const L = lauf, inh = $("#inhalt"); clearInterval(uhrId);
    L.reihe.forEach(id => { if (!L.ergebnis[id]) L.ergebnis[id] = "rot"; });
    const gruen = L.reihe.filter(id => L.ergebnis[id] === "gruen").length;
    if (L.art === "check") S.check = L.ergebnis; else S.generalprobe = { richtig: gruen, gesamt: L.reihe.length };
    if (L.art === "gp") S.check = L.ergebnis;
    speichern();
    const zeile = id => { const e = L.ergebnis[id]; return `<div class="passkarte">${BILD[id]}<div><b>${station(id).name}</b><br><span class="ampel ${e}" style="position:static">${e === "gruen" ? "Sitzt" : e === "gelb" ? "Noch unsicher" : "Hier zuerst"}</span></div></div>`; };
    inh.innerHTML = `<section class="kachel"><div style="width:110px">${COACH("hupf")}</div><h1 class="schrift" style="font-size:32px;color:var(--blau-tief)">${L.art === "check" ? "Deine Ampel steht" : "Generalprobe geschafft"}</h1><p><b>${gruen} von ${L.reihe.length}</b> auf Anhieb richtig. Das ist keine Note, sondern dein Wegweiser.</p>
      <div class="passraster">${L.reihe.map(zeile).join("")}</div>
      ${L.art === "gp" ? `<h2 style="margin-top:18px;font-size:22px;color:var(--blau-tief)">3 Minuten: Merkzettel ins Heft</h2><ul class="liste"><li>Zu jeder roten Station: eine Formel und ein Beispiel.</li><li>Dein häufigster Fehler in einem Satz.</li><li>Was du zu Hause noch einmal übst.</li></ul>` : ""}
      <div class="knoepfe"><button class="knopf" id="zum-start">Zu den Stationen</button></div></section>`;
    $("#zum-start").addEventListener("click", () => gehe({ art: "start" }));
  }

  /* ---------- Checkliste ----------
     Pro Punkt: selbst abhaken oder mit einer mittelschweren Testaufgabe beweisen.
     S.liste[id] = { kann: true|false, test: "ok"|"nochmal"|undefined } */
  const HAKEN = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const punkt = id => PUNKTE.find(p => p.id === id);
  const punktStand = id => S.liste[id] || {};
  const abgehakt = () => PUNKTE.filter(p => punktStand(p.id).kann);
  const bewiesen = () => PUNKTE.filter(p => punktStand(p.id).test === "ok");

  function listeSeite() {
    const n = PUNKTE.length, ab = abgehakt().length, bw = bewiesen().length, offen = n - ab;
    const letzte = S.listeProbe ? `<p class="klein">Letzte Generalprobe: <b>${S.listeProbe.richtig} von ${S.listeProbe.gesamt}</b> Punkten auf Anhieb richtig.</p>` : "";
    const zeile = p => {
      const st = punktStand(p.id);
      const status = st.test === "ok" ? `<span class="ckstatus ok">Mit Aufgabe bewiesen</span>`
        : st.test === "nochmal" ? `<span class="ckstatus nochmal">Test ging daneben</span><button class="textlink" data-station="${p.station}">Zur Station ${station(p.station).name}</button>` : "";
      return `<li class="ckpunkt ${st.kann ? "an" : ""} ${st.test || ""}">
        <label class="ckbox"><input type="checkbox" data-kann="${p.id}" ${st.kann ? "checked" : ""} aria-label="Kann ich: ${p.text}"><span class="ckhaken">${HAKEN}</span></label>
        <div class="cktext"><span>${p.text}</span>${status ? `<div class="ckzeile">${status}</div>` : ""}</div>
        <button class="knopf cktest" data-test="${p.id}">${st.test ? "Nochmal testen" : "Testen"}</button></li>`;
    };
    const gruppen = CHECKLISTE.map(g => {
      const fertig = g.punkte.filter(p => punktStand(p.id).kann).length;
      return `<section class="kachel ckgruppe farbe${FARBE[g.station]}"><div class="ckkopf">${BILD[g.station]}<h2>${g.thema}</h2><span class="ckzahl ${fertig === g.punkte.length ? "voll" : ""}">${fertig} / ${g.punkte.length}</span></div>
        <ul class="ckliste">${g.punkte.map(p => zeile(Object.assign({ station: g.station }, p))).join("")}</ul></section>`;
    }).join("");
    return `<section class="kachel held ckheld"><div class="ueber">Mathe M8 · Leistungsnachweis Prozent</div><h1>Das musst du für die Probe können</h1>
      <p>Geh die Liste Punkt für Punkt durch. Drückst du <b>Testen</b>, bekommst du eine mittelschwere Aufgabe genau dazu. Rechne im Heft und tippe das Ergebnis ein. Ist es richtig, wird der Punkt abgehakt. Was du sicher kannst, darfst du auch selbst abhaken.</p>
      <div class="ckstand"><div class="fortschritt"><i style="width:${ab / n * 100}%"></i></div><span><b>${ab} von ${n}</b> abgehakt, davon ${bw} mit Aufgabe bewiesen</span></div>${letzte}
      <div class="knoepfe"><button class="knopf gelb" id="ck-alle">Generalprobe: alle ${n} Punkte testen</button>${offen && offen < n ? `<button class="knopf zwei" id="ck-offen">Nur offene Punkte testen (${offen})</button>` : ""}</div></section>
      <div class="ckraster">${gruppen}</div>`;
  }
  function listeVerbinden() {
    app.querySelectorAll("[data-kann]").forEach(c => c.addEventListener("change", () => {
      const id = c.dataset.kann;
      S.liste[id] = c.checked ? Object.assign({}, punktStand(id), { kann: true }) : { kann: false };
      speichern(); const y = window.scrollY; zeichnen(); window.scrollTo(0, y);
    }));
    app.querySelectorAll("[data-test]").forEach(b => b.addEventListener("click", () => testStarten([b.dataset.test], false)));
    const alle = $("#ck-alle"); if (alle) alle.addEventListener("click", () => testStarten(PUNKTE.map(p => p.id), true));
    const off = $("#ck-offen"); if (off) off.addEventListener("click", () => testStarten(PUNKTE.filter(p => !punktStand(p.id).kann).map(p => p.id), true));
  }

  let test = null;
  function testStarten(reihe, generalprobe) {
    if (!reihe.length) return;
    test = { reihe, i: 0, gp: generalprobe, ergebnis: {}, z: neuerZustand(erzeugePunkt(reihe[0])) };
    ansicht = { art: "test" }; zeichnen(); window.scrollTo(0, 0);
  }
  function testZeichnen() {
    const T = test, inh = $("#inhalt");
    if (!T) return gehe({ art: "liste" });
    if (T.i >= T.reihe.length) return testEnde();
    const p = punkt(T.reihe[T.i]), letzter = T.i === T.reihe.length - 1;
    inh.innerHTML = `<button class="zurueck" id="test-ab">${T.gp ? "Generalprobe abbrechen" : "Zur Checkliste"}</button>
      ${T.gp ? `<div class="leiste"><h1 class="schrift" style="font-size:30px;color:var(--blau-tief)">Generalprobe</h1></div><div class="klein">Punkt ${T.i + 1} von ${T.reihe.length}. Ein Versuch pro Aufgabe. Weißt du es nicht, überspring sie.</div><div class="fortschritt"><i style="width:${T.i / T.reihe.length * 100}%"></i></div>` : ""}
      <div class="ckfrage">${BILD[p.station]}<div><span class="klein">${p.thema}</span><b>${p.text}</b></div></div>
      <div id="aufgabe"></div>`;
    $("#test-ab").addEventListener("click", () => { if (T.gp && T.i > 0) return testEnde(); test = null; gehe({ art: "liste" }); });
    const ziel = $("#aufgabe");
    const zeichneAufgabe = () => {
      aufgabeZeichnen(ziel, T.z, {
        bewerten: (z, ok) => {
          T.ergebnis[p.id] = ok ? "ok" : "nochmal";
          S.liste[p.id] = ok ? { kann: true, test: "ok" } : { kann: false, test: "nochmal" };
          speichern(); zeichneAufgabe();
        },
        fehl: () => {},
        weiter: () => {
          if (!T.z.fertig) T.ergebnis[p.id] = "weg";
          if (!T.gp) { test = null; return gehe({ art: "liste" }); }
          T.i++;
          if (T.i < T.reihe.length) T.z = neuerZustand(erzeugePunkt(T.reihe[T.i]));
          testZeichnen(); window.scrollTo(0, 0);
        }
      }, { ohneWeg: true, einVersuch: true, weiterText: T.gp ? (T.z.fertig ? (letzter ? "Auswertung" : "Weiter") : "Überspringen") : "Zur Checkliste" });
      /* Einzeltest: nach dem Ergebnis gleich noch eine Aufgabe zum selben Punkt anbieten. */
      if (!T.gp && T.z.fertig) {
        const leiste = ziel.querySelector(".aktionen");
        if (leiste) {
          const b = document.createElement("button"); b.className = "knopf zwei"; b.textContent = "Noch eine Aufgabe dazu";
          b.addEventListener("click", () => { T.z = neuerZustand(erzeugePunkt(p.id)); zeichneAufgabe(); window.scrollTo(0, 0); });
          leiste.appendChild(b);
        }
      }
    };
    zeichneAufgabe();
  }
  function testEnde() {
    const T = test, inh = $("#inhalt");
    const gemacht = T.reihe.filter(id => T.ergebnis[id]);
    const richtig = gemacht.filter(id => T.ergebnis[id] === "ok").length;
    const offen = T.reihe.filter(id => T.ergebnis[id] !== "ok");
    S.listeProbe = { richtig, gesamt: T.reihe.length }; speichern();
    const zeile = id => {
      const p = punkt(id), e = T.ergebnis[id] || "weg";
      const lbl = e === "ok" ? "Sitzt" : e === "nochmal" ? "Noch üben" : "Nicht bearbeitet";
      return `<div class="passkarte">${BILD[p.station]}<div><span class="klein">${p.thema}</span><br><b style="font-weight:600">${p.text}</b><br><span class="ampel ${e === "ok" ? "gruen" : e === "nochmal" ? "rot" : "gelb"}" style="position:static">${lbl}</span></div></div>`;
    };
    inh.innerHTML = `<section class="kachel"><div style="width:110px">${COACH("hupf")}</div><h1 class="schrift" style="font-size:32px;color:var(--blau-tief)">Generalprobe ausgewertet</h1>
      <p><b>${richtig} von ${T.reihe.length}</b> Punkten auf Anhieb richtig. Das ist keine Note. Es zeigt dir, was du vor der Probe noch üben solltest.</p>
      ${offen.length ? `<p>Übe die roten Punkte an ihrer Station und teste sie danach in der Checkliste noch einmal.</p>` : `<p>Alles bewiesen. Du bist bereit.</p>`}
      <div class="passraster">${T.reihe.map(zeile).join("")}</div>
      <div class="knoepfe"><button class="knopf" id="zur-liste">Zur Checkliste</button>${offen.length ? `<button class="knopf zwei" id="nochmal-offen">Offene Punkte nochmal testen (${offen.length})</button>` : ""}</div></section>`;
    test = null;
    $("#zur-liste").addEventListener("click", () => gehe({ art: "liste" }));
    const n = $("#nochmal-offen"); if (n) n.addEventListener("click", () => testStarten(offen, true));
    window.scrollTo(0, 0);
  }

  window.__stand = () => ({ S, aktuell, lauf, test });
  zeichnen();
})();

</script>
</body>
</html>
